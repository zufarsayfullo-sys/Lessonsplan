<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 4.2</title>
<style>
  :root{--y:#FFD400;--yd:#E6BF00;--b:#111111;--bs:#1a1a1a;--gb:#333333;--gt:#999999;--gl:#cccccc;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--b);color:#eee;min-height:100vh;display:flex;flex-direction:column;}
  a{text-decoration:none;color:inherit;}
  .page{flex:1;display:flex;flex-direction:column;padding:20px 32px 24px;max-width:960px;width:100%;margin:0 auto;}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back-link{color:var(--y);font-size:20px;font-weight:bold;}
  .back-link:hover{opacity:.8;}

  /* outline */
  #outlineScreen{flex:1;display:flex;flex-direction:column;}
  .lesson-title{color:var(--y);font-size:26px;font-weight:bold;margin-bottom:4px;}
  .lesson-sub{color:var(--gt);font-size:14px;margin-bottom:22px;}
  .outline-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
  .outline-item{display:flex;align-items:center;gap:12px;background:var(--bs);border-radius:6px;padding:13px 16px;font-size:15px;color:#eee;}
  .outline-item .num{background:#333;color:var(--y);border-radius:50%;width:26px;height:26px;min-width:26px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;}
  .outline-item .tag{margin-left:auto;color:var(--gt);font-size:12px;}
  .btn-row{display:flex;justify-content:flex-end;}
  .btn{background:var(--y);color:var(--b);border:none;border-radius:6px;padding:12px 24px;font-weight:bold;font-size:15px;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--yd);}

  /* present */
  #presentScreen{flex:1;display:none;flex-direction:column;}
  .present-wrap{flex:1;display:flex;flex-direction:column;background:var(--bs);border-radius:10px;overflow:hidden;}
  .present-header{background:var(--y);color:var(--b);padding:12px 24px;font-weight:bold;font-size:15px;}
  .present-body{flex:1;padding:32px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow-y:auto;}
  .present-footer{background:var(--b);border-top:1px solid var(--gb);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;}
  .nav-btn{background:none;border:none;font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer;color:var(--gt);}
  .nav-btn:disabled{opacity:.2;cursor:not-allowed;}
  .nav-btn.primary{background:var(--y);color:var(--b);border-radius:6px;padding:9px 20px;}
  .step-counter{color:#555;font-size:13px;}

  /* content */
  .big-qmark{font-size:180px;color:var(--y);line-height:1;}
  .image-box{width:100%;max-width:700px;height:min(55vh,460px);background:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#555;font-size:13px;border:1px solid #333;overflow:hidden;}
  .image-box img{width:100%;height:100%;object-fit:contain;}

  /* vocab card */
  .vocab-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:640px;}
  .vocab-word{font-size:36px;color:var(--y);font-weight:bold;margin-bottom:4px;}
  .vocab-pos{font-size:13px;color:var(--gt);margin-bottom:16px;}
  .vocab-svg{margin-bottom:16px;}
  .vocab-example{background:var(--b);border-left:4px solid var(--y);padding:12px 16px;color:var(--gl);font-size:15px;text-align:left;border-radius:4px;width:100%;max-width:500px;}
  .show-ex-btn{margin-top:14px;background:none;border:2px solid var(--y);color:var(--y);border-radius:6px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:inherit;}

  /* discussion */
  .discuss-wrap{width:100%;max-width:640px;text-align:left;}
  .discuss-intro{color:var(--gt);font-size:13px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em;}
  .discuss-q{display:flex;gap:10px;margin-bottom:12px;}
  .discuss-num{color:var(--y);font-weight:bold;min-width:20px;font-size:15px;}
  .discuss-text{color:#eee;font-size:16px;line-height:1.6;}

  /* places */
  .places-wrap{width:100%;max-width:500px;text-align:left;}
  .places-intro{color:var(--gt);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;text-align:center;}
  .place-item{background:var(--b);border-left:4px solid var(--y);padding:11px 16px;color:var(--y);font-size:17px;font-weight:bold;border-radius:4px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
  .place-country{color:#555;font-size:12px;font-weight:normal;}

  /* listening instruction */
  .instruction-text{font-size:26px;color:var(--y);font-weight:bold;line-height:1.6;}

  /* game */
  .game-wrap{width:100%;max-width:800px;}
  .scoreboard{display:flex;margin-bottom:14px;border-radius:8px;overflow:hidden;border:1px solid var(--gb);}
  .score-col{flex:1;padding:12px;text-align:center;background:var(--b);}
  .score-label{font-weight:bold;font-size:13px;margin-bottom:4px;}
  .score-val{font-size:30px;font-weight:bold;}
  .game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .game-cell{background:var(--b);border:2px solid var(--gb);border-radius:8px;padding:14px 8px;text-align:center;cursor:pointer;font-size:18px;color:var(--y);font-weight:bold;min-height:64px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .game-cell:hover:not(.claimed){background:#1a1a00;border-color:var(--y);}
  .game-panel{display:none;background:var(--b);border-radius:8px;padding:18px;margin-bottom:12px;border:1px solid var(--gb);}
  .game-task{color:var(--y);font-size:18px;font-weight:bold;line-height:1.6;margin-bottom:14px;text-align:center;min-height:60px;}
  .game-answer{color:#4caf50;font-size:16px;font-weight:bold;text-align:center;padding-top:12px;border-top:1px solid var(--gb);display:none;}
  .game-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
  .gbtn{border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;}
  .reset-btn{background:#222;color:var(--y);border:none;border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;width:100%;}
</style>
</head>

/* ── STEPS ── */
function makeSteps(){
  const s = [];
  s.push({ section:'Lead-in',                type:'qmark'       });
  s.push({ section:'Lead-in',                type:'leadin-img'  });
  transportVocab.forEach((v,i)=> s.push({ section:'Vocabulary', type:'vocab-transport', idx:i }));
  s.push({ section:'Discussion — have got',  type:'discussion'  });
  listenVocab.forEach((v,i)=> s.push({ section:'Before you listen', type:'vocab-listen', idx:i }));
  s.push({ section:'Before you listen',      type:'places'      });
  s.push({ section:'Listening',              type:'instruction' });
  s.push({ section:'Grammar game',           type:'game'        });
  return s;
}

/* ── HELPERS ── */
function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

function vocabCard(v, showExBtn){
  const w = document.createElement('div');
  w.className = 'vocab-wrap';
  const exId = 'ex_' + Math.random().toString(36).slice(2);
  const btnId = 'btn_' + Math.random().toString(36).slice(2);
  w.innerHTML = `
    <div class="vocab-word">${v.w}</div>
    <div class="vocab-pos">${v.pos}</div>
    <div class="vocab-svg">${SVG[v.svg]}</div>
    <div class="vocab-example" id="${exId}" style="display:none;">${v.ex}</div>
    <button class="show-ex-btn" id="${btnId}">Show example ▾</button>
  `;
  w.querySelector(`#${btnId}`).onclick = function(){
    document.getElementById(exId).style.display='block';
    this.style.display='none';
  };
  return w;
}

      <div class="game-answer" id="gAnswer"></div>
      <div class="game-btns">
        <button class="gbtn" style="background:#333;color:var(--y);" onclick="gReveal()">Reveal ✓</button>
        <button class="gbtn" style="background:var(--y);color:#111;" onclick="gPoint('A')">⭕ A +1</button>
        <button class="gbtn" style="background:#333;color:#fff;" onclick="gPoint('B')">✖ B +1</button>
      </div>
    </div>
    <button class="reset-btn" onclick="gReset()">↺ Reset game</button>
  `;
  const grid = wrap.querySelector('#gGrid');
  for(let i=0;i<12;i++){
    const c=document.createElement('div');
    c.className='game-cell'; c.id='gc'+i; c.textContent=i+1;
    c.onclick=()=>gSelect(i);
    grid.appendChild(c);
  }
  return wrap;
}
window.gSelect=function(ci){
  if(gClaimed[ci]!==null) return;
  const qi=gShuffled[ci];
  const q=gameSentences[qi];
  const showJumbled=Math.random()>.5;
  gActive={ci,qi};
  document.getElementById('gPanel').style.display='block';
  document.getElementById('gAnswer').style.display='none';
  document.getElementById('gAnswer').textContent='';
  const task=document.getElementById('gTask');
  if(showJumbled){
    task.innerHTML=shuffle(q.words).map(w=>`<span style="display:inline-block;background:#222;border:1px solid #444;color:#eee;border-radius:4px;padding:5px 10px;font-size:15px;margin:3px;">${w}</span>`).join('');
  } else {
    task.textContent=q.pos;
  }
  document.getElementById('gc'+ci).style.borderColor='var(--y)';
  document.getElementById('gc'+ci).style.background='#1a1a00';
};
window.gReveal=function(){
  if(!gActive) return;
  const ans=document.getElementById('gAnswer');
  ans.textContent=gameSentences[gActive.qi].ans;
  ans.style.display='block';
};
window.gPoint=function(team){
  if(!gActive) return;
  gScores[team]++;
  document.getElementById('gScore'+team).textContent=gScores[team];
  const sym=team==='A'?'⭕':'✖';
  const col=team==='A'?'#FFD400':'#fff';
  const c=document.getElementById('gc'+gActive.ci);
  c.textContent=sym; c.style.fontSize='26px'; c.style.color=col;
  c.style.borderColor=col; c.style.background='#111'; c.style.cursor='default';
  c.classList.add('claimed'); c.onclick=null;
  gClaimed[gActive.ci]=team; gActive=null;
  document.getElementById('gPanel').style.display='none';
};
window.gReset=function(){
  const body=document.getElementById('stepBody');
  body.innerHTML=''; body.appendChild(buildGame());
};

/* ── RENDER ── */
function renderStep(){
  const s=steps[current];
  const body=document.getElementById('stepBody');
  body.innerHTML='';
  document.getElementById('sectionLabel').textContent='Lesson 4.2 \u00b7 '+s.section;

  let el;
  if(s.type==='qmark'){
    el=document.createElement('div'); el.className='big-qmark'; el.textContent='?';
  }
  else if(s.type==='leadin-img'){
    el=document.createElement('div'); el.className='image-box';
    const img=document.createElement('img');
    img.src='image_2026-07-02_12-54-26.png'; img.alt='transport';
    img.onerror=()=>{ el.textContent='[ transport picture ]'; };
    el.appendChild(img);
  }
  else if(s.type==='vocab-transport'){
    el=vocabCard(transportVocab[s.idx]);
  }
  else if(s.type==='discussion'){
    el=document.createElement('div'); el.className='discuss-wrap';
    el.innerHTML=`
      <div class="discuss-intro">Talk to your partner &mdash; use have got</div>
      <div class="discuss-q"><span class="discuss-num">1</span><span class="discuss-text">Have you got a car at home?</span></div>
      <div class="discuss-q"><span class="discuss-num">2</span><span class="discuss-text">Have you got a bicycle?</span></div>
      <div class="discuss-q"><span class="discuss-num">3</span><span class="discuss-text">Has your family got a motorbike?</span></div>
      <div class="discuss-q"><span class="discuss-num">4</span><span class="discuss-text">Have you got a bus stop near your home?</span></div>
    `;
  }
  else if(s.type==='vocab-listen'){
    el=vocabCard(listenVocab[s.idx]);
  }
  else if(s.type==='places'){
    el=document.createElement('div'); el.className='places-wrap';
    el.innerHTML=`
      <div class="places-intro">You will hear these places</div>
      <div class="place-item">🇩🇰 Copenhagen <span class="place-country">Denmark</span></div>
      <div class="place-item">🇧🇷 São Paulo <span class="place-country">Brazil</span></div>
      <div class="place-item">🇻🇳 Hanoi <span class="place-country">Vietnam</span></div>
      <div class="place-item">🇿🇦 Johannesburg <span class="place-country">South Africa</span></div>
      <div class="place-item">🇿🇦 Pretoria <span class="place-country">South Africa</span></div>
    `;
  }
  else if(s.type==='instruction'){
    el=document.createElement('div'); el.className='instruction-text';
    el.innerHTML='Listen and complete<br>the exercises in your book.';
  }
  else if(s.type==='game'){
    el=buildGame();
  }

  body.appendChild(el);
  document.getElementById('stepCounter').textContent=(current+1)+' / '+steps.length;
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').textContent=current===steps.length-1?'Done':'next \u2192';
}

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('outlineScreen').style.display='none';
  document.getElementById('presentScreen').style.display='flex';
  current=0; renderStep();
};
document.getElementById('nextBtn').onclick=()=>{ if(current<steps.length-1){current++;renderStep();} };
document.getElementById('prevBtn').onclick=()=>{ if(current>0){current--;renderStep();} };
</script>
</body>
</html>
