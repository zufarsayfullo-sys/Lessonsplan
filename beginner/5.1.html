<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 6.1</title>
<style>
  :root{--y:#FFD400;--yd:#E6BF00;--b:#111111;--bs:#1a1a1a;--gb:#333333;--gt:#999999;--gl:#cccccc;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--b);color:#eee;min-height:100vh;display:flex;flex-direction:column;}
  a{text-decoration:none;color:inherit;}
  .page{flex:1;display:flex;flex-direction:column;padding:16px 28px 20px;max-width:1100px;width:100%;margin:0 auto;}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .back-link{color:var(--y);font-size:20px;font-weight:bold;}
  #outlineScreen{flex:1;display:flex;flex-direction:column;}
  .lesson-title{color:var(--y);font-size:26px;font-weight:bold;margin-bottom:4px;}
  .lesson-sub{color:var(--gt);font-size:14px;margin-bottom:20px;}
  .outline-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
  .outline-item{display:flex;align-items:center;gap:12px;background:var(--bs);border-radius:6px;padding:12px 16px;font-size:15px;color:#eee;}
  .outline-item .num{background:#333;color:var(--y);border-radius:50%;width:26px;height:26px;min-width:26px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;}
  .outline-item .tag{margin-left:auto;color:var(--gt);font-size:12px;}
  .btn-row{display:flex;justify-content:flex-end;}
  .btn{background:var(--y);color:var(--b);border:none;border-radius:6px;padding:12px 24px;font-weight:bold;font-size:15px;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--yd);}
  #presentScreen{flex:1;display:none;flex-direction:column;}
  .present-wrap{flex:1;display:flex;flex-direction:column;background:var(--bs);border-radius:10px;overflow:hidden;}
  .present-header{background:var(--y);color:var(--b);padding:10px 18px;font-weight:bold;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .header-left{display:flex;align-items:center;gap:10px;}
  .hbtn{background:var(--b);color:var(--y);border:none;border-radius:6px;padding:4px 11px;font-size:12px;font-weight:bold;cursor:pointer;font-family:inherit;}
  .print-btn-h{display:none;}
  .timer-widget{display:flex;align-items:center;gap:5px;background:var(--b);border-radius:8px;padding:4px 9px;}
  .timer-adj{background:none;border:none;color:var(--y);font-size:16px;font-weight:bold;cursor:pointer;width:20px;font-family:inherit;}
  .timer-display{font-family:'Courier New',monospace;font-size:15px;color:var(--y);min-width:52px;text-align:center;}
  .timer-display.warn{color:#e24b4a;}
  .timer-toggle{background:none;border:1px solid var(--y);color:var(--y);border-radius:4px;padding:2px 7px;font-size:11px;cursor:pointer;font-family:inherit;margin-left:3px;}
  .timer-rec{color:rgba(0,0,0,0.45);font-size:11px;}
  .present-body{flex:1;padding:24px 36px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow-y:auto;text-align:center;}
  .present-footer{background:var(--b);border-top:1px solid var(--gb);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;}
  .nav-btn{background:none;border:none;font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer;color:var(--gt);}
  .nav-btn:disabled{opacity:.2;cursor:not-allowed;}
  .nav-btn.primary{background:var(--y);color:var(--b);border-radius:6px;padding:9px 20px;}
  .step-counter{color:#555;font-size:13px;}
  /* lead-in */
  .lead-img{width:100%;max-width:820px;height:min(42vh,340px);background:#000;border-radius:8px;overflow:hidden;border:1px solid #333;display:flex;align-items:center;justify-content:center;color:#555;}
  .lead-img img{width:100%;height:100%;object-fit:contain;}
  .lead-question{background:var(--b);border-left:4px solid var(--y);padding:14px 18px;color:#eee;font-size:20px;width:100%;max-width:820px;margin-top:16px;text-align:left;}
  /* board */
  .board-wrap{width:100%;max-width:880px;text-align:left;}
  .board-grid{display:grid;gap:8px;}
  .flip-card{background:#2a2a2a;border:2px solid #444;border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:border-color .2s,background .2s;}
  .flip-card.open{background:var(--b);border-color:var(--y);}
  .flip-card .q-mark{font-size:24px;color:#555;}
  .flip-card .card-word{font-size:10px;color:var(--y);font-weight:bold;margin-top:3px;line-height:1.2;}
  .board-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .board-count{color:var(--gt);font-size:12px;}
  .board-reset{background:none;border:1px solid var(--y);color:var(--y);border-radius:5px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
  /* overlay */
  #overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:200;}
  #popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:201;background:#1a1a1a;border:3px solid var(--y);border-radius:12px;padding:22px 28px;text-align:center;min-width:220px;max-width:340px;}
  .popup-q{color:var(--gt);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
  .popup-word{font-size:24px;color:var(--y);font-weight:bold;margin-top:8px;display:none;}
  .popup-reveal{margin-top:12px;background:none;border:2px solid var(--y);color:var(--y);border-radius:6px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit;}
  .popup-hint{color:#444;font-size:11px;margin-top:10px;}
  /* colours */
  .colour-wrap{width:100%;max-width:500px;}
  .colour-block{width:100%;height:min(32vh,240px);border-radius:12px;margin-bottom:18px;}
  .colour-q{color:var(--gt);font-size:14px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;}
  .colour-answer{font-size:36px;color:var(--y);font-weight:bold;margin-bottom:10px;display:none;}
  .colour-reveal{background:none;border:2px solid var(--y);color:var(--y);border-radius:6px;padding:9px 20px;font-size:14px;cursor:pointer;font-family:inherit;}
  /* colour ref */
  .colour-ref-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:600px;}
  .colour-ref-item{text-align:center;}
  .colour-ref-swatch{height:64px;border-radius:8px;margin-bottom:6px;}
  .colour-ref-name{color:var(--y);font-size:14px;font-weight:bold;}
  /* pairwork */
  .pairwork-wrap{width:100%;max-width:820px;}
  .pair-img{width:100%;height:min(30vh,220px);background:#000;border-radius:8px;overflow:hidden;border:1px solid #333;display:flex;align-items:center;justify-content:center;color:#555;margin-bottom:18px;}
  .pair-img img{width:100%;height:100%;object-fit:contain;}
  .pair-starter{background:var(--b);border-left:4px solid var(--y);padding:12px 16px;border-radius:4px;margin-bottom:10px;text-align:left;}
  .starter-key{color:var(--y);font-weight:bold;font-size:16px;}
  .starter-fill{color:#555;font-size:16px;}
  /* tabs */
  .reading-wrap{width:100%;max-width:860px;text-align:left;}
  .tab-bar{display:flex;border-bottom:1px solid var(--gb);}
  .tab{flex:1;padding:10px 6px;text-align:center;font-size:12px;font-weight:bold;cursor:pointer;color:var(--gt);background:var(--b);border-bottom:2px solid transparent;}
  .tab.active{color:var(--y);border-bottom:2px solid var(--y);background:var(--bs);}
  .tab-pane{display:none;padding:16px 4px;max-height:52vh;overflow-y:auto;}
  .tab-pane.active{display:block;}
  /* reading text */
  .reading-title{color:var(--y);font-size:17px;font-weight:bold;margin-bottom:12px;}
  .reading-text{color:#eee;font-size:14px;line-height:1.85;}
  .reading-text p{margin-bottom:10px;}
  .speaker{color:var(--y);font-weight:bold;}
  /* exercises */
  .ex-instr{color:var(--gt);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
  .ex-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;}
  .ex-num{color:var(--y);font-weight:bold;min-width:20px;font-size:14px;}
  .ex-text{color:#eee;font-size:14px;line-height:1.6;flex:1;}
  .mc-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .mc-opt{background:#222;border:2px solid #444;color:#eee;border-radius:6px;padding:5px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;}
  .mc-opt:hover{border-color:var(--y);color:var(--y);}
  .mc-opt.correct{background:#1a3a1a;border-color:#4caf50;color:#4caf50;}
  .mc-opt.wrong{background:#3a1a1a;border-color:#e24b4a;color:#e24b4a;}
  .ans-line{border-bottom:1px solid #555;min-width:90px;display:inline-block;margin-left:8px;}
  /* connectors */
  .connector-card{background:var(--b);border-radius:8px;padding:14px 16px;margin-bottom:12px;}
  .connector-pill{display:inline-block;background:var(--y);color:var(--b);font-weight:bold;font-size:15px;padding:4px 16px;border-radius:20px;margin-right:8px;}
  .connector-meaning{color:var(--gt);font-size:13px;}
  .connector-example{color:var(--gl);font-size:14px;font-style:italic;margin-top:8px;}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .match-col-head{color:var(--y);font-size:12px;font-weight:bold;margin-bottom:8px;text-transform:uppercase;}
  .match-item{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
  .match-num{color:var(--y);font-weight:bold;min-width:16px;font-size:13px;}
  .match-text{color:#eee;font-size:13px;line-height:1.5;}

  /* PRINT */
  @media print{
    .topbar,#outlineScreen,.present-header,.present-footer,#overlay,#popup,.board-reset,.colour-reveal,.popup-reveal,.mc-opt{display:none!important;}
    body,.page,#presentScreen,.present-wrap,.present-body,.reading-wrap{display:block!important;background:#fff!important;color:#000!important;padding:0!important;margin:0!important;max-width:100%!important;width:100%!important;border:none!important;border-radius:0!important;overflow:visible!important;}
    .tab-pane{display:block!important;max-height:none!important;overflow:visible!important;padding:0 0 16px!important;}
    .tab-pane+.tab-pane{border-top:1px solid #ccc;padding-top:16px!important;margin-top:4px;}
    .tab-bar{display:none!important;}
    .reading-title,.speaker,.ex-num,.match-num,.connector-pill{color:#000!important;}
    .reading-text,.ex-text,.match-text,.connector-example,.connector-meaning{color:#000!important;}
    .connector-pill{background:#000!important;color:#fff!important;}
    .ans-line{border-bottom:1px solid #000!important;}
    .ex-item{margin-bottom:12px!important;}
    .mc-opts::before{content:'Hussain / Philip / Sophie'!important;color:#000;font-size:13px;}
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><a class="back-link" href="index.html">&#8592;</a></div>

  <div id="outlineScreen">
    <div class="lesson-title">Lesson 6.1</div>
    <div class="lesson-sub">Unit 6 &middot; Clothes</div>
    <div class="outline-list">
      <div class="outline-item"><span class="num">1</span>Lead-in<span class="tag">5 min</span></div>
      <div class="outline-item"><span class="num">2</span>Clothes vocabulary<span class="tag">12 words</span></div>
      <div class="outline-item"><span class="num">3</span>Task 5<span class="tag">instruction</span></div>
      <div class="outline-item"><span class="num">4</span>Colours<span class="tag">8 colours + reference</span></div>
      <div class="outline-item"><span class="num">5</span>Pair work<span class="tag">5 min</span></div>
      <div class="outline-item"><span class="num">6</span>Pre-teach vocabulary<span class="tag">14 words</span></div>
      <div class="outline-item"><span class="num">7</span>Reading &amp; questions<span class="tag">text · Who? · True/False</span></div>
      <div class="outline-item"><span class="num">8</span>Connectors<span class="tag">and / but / because</span></div>
    </div>
    <div class="btn-row"><button class="btn" id="startBtn">Start lesson &#8594;</button></div>
  </div>

  <div id="presentScreen">
    <div class="present-wrap">
      <div class="present-header">
        <div class="header-left">
          <span id="sectionLabel">Lesson 6.1</span>
          <button class="hbtn print-btn-h" id="printBtn" onclick="window.print()">&#128438; Print</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="timer-rec" id="recLabel"></span>
          <div class="timer-widget">
            <button class="timer-adj" id="tMinus">&#8722;</button>
            <span class="timer-display" id="tDisplay">05:00</span>
            <button class="timer-adj" id="tPlus">+</button>
            <button class="timer-toggle" id="tToggle">&#9654;</button>
          </div>
          <button class="hbtn" id="fsBtn" title="Fullscreen" style="font-size:15px;padding:4px 8px;">&#x26F6;</button>
        </div>
      </div>
      <div class="present-body" id="stepBody"></div>
      <div class="present-footer">
        <button class="nav-btn" id="prevBtn">&#8592; prev</button>
        <span class="step-counter" id="stepCounter"></span>
        <button class="nav-btn primary" id="nextBtn">next &#8594;</button>
      </div>
    </div>
  </div>
</div>

<div id="overlay" onclick="closePopup()"></div>
<div id="popup">
  <div class="popup-q" id="popupQ"></div>
  <div id="popupSvg"></div>
  <div class="popup-word" id="popupWord"></div>
  <button class="popup-reveal" id="popupReveal" onclick="revealPopupWord()">Show answer ▾</button>
  <div class="popup-hint">click outside to close</div>
</div>

<script>
/* FULLSCREEN */
document.getElementById('fsBtn').onclick=function(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});this.textContent='✕';}
  else{document.exitFullscreen();this.textContent='⛶';}
};
document.addEventListener('fullscreenchange',()=>{document.getElementById('fsBtn').textContent=document.fullscreenElement?'✕':'⛶';});

/* TIMER */
let tSecs=300,tRunning=false,tInterval=null;
function setTimer(m){tSecs=m*60;tRunning=false;clearInterval(tInterval);document.getElementById('tToggle').textContent='▶';renderTimer();}
function renderTimer(){const m=Math.floor(Math.abs(tSecs)/60),s=Math.abs(tSecs)%60,neg=tSecs<0?'-':'',d=document.getElementById('tDisplay');d.textContent=neg+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');d.className='timer-display'+(tSecs<=30&&tSecs>=-999?' warn':'');}
document.getElementById('tToggle').onclick=function(){if(tRunning){clearInterval(tInterval);tRunning=false;this.textContent='▶';}else{tRunning=true;this.textContent='⏸';tInterval=setInterval(()=>{tSecs--;renderTimer();},1000);}};
document.getElementById('tMinus').onclick=()=>{tSecs=Math.max(0,tSecs-60);renderTimer();};
document.getElementById('tPlus').onclick=()=>{tSecs+=60;renderTimer();};

/* CLOTHES SVGs — distinct colours per item */

  jeans:`<svg viewBox="0 0 80 90" width="70" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="5" width="60" height="45" rx="4" fill="#3B82F6"/><rect x="10" y="45" width="25" height="42" rx="4" fill="#3B82F6"/><rect x="45" y="45" width="25" height="42" rx="4" fill="#3B82F6"/><rect x="10" y="5" width="60" height="8" rx="3" fill="#1D4ED8"/><line x1="40" y1="13" x2="40" y2="50" stroke="#1D4ED8" stroke-width="2"/><line x1="15" y1="28" x2="25" y2="28" stroke="#1D4ED8" stroke-width="1.5"/></svg>`,
  jumper:`<svg viewBox="0 0 80 80" width="70" xmlns="http://www.w3.org/2000/svg"><path d="M20,20 L10,35 L22,38 L22,70 L58,70 L58,38 L70,35 L60,20 L48,28 Q40,32 32,28 Z" fill="#EF4444"/><ellipse cx="40" cy="20" rx="12" ry="8" fill="#111" stroke="#EF4444" stroke-width="2"/><line x1="22" y1="50" x2="58" y2="50" stroke="#DC2626" stroke-width="2"/><line x1="22" y1="58" x2="58" y2="58" stroke="#DC2626" stroke-width="2"/></svg>`,
  top:`<svg viewBox="0 0 80 80" width="70" xmlns="http://www.w3.org/2000/svg"><path d="M22,18 L10,32 L22,35 L22,68 L58,68 L58,35 L70,32 L58,18 L48,24 Q40,28 32,24 Z" fill="#EC4899"/><ellipse cx="40" cy="18" rx="10" ry="7" fill="#111" stroke="#EC4899" stroke-width="2"/></svg>`,
  trousers:`<svg viewBox="0 0 80 90" width="70" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="5" width="64" height="40" rx="4" fill="#6B7280"/><rect x="8" y="40" width="28" height="45" rx="4" fill="#6B7280"/><rect x="44" y="40" width="28" height="45" rx="4" fill="#6B7280"/><line x1="40" y1="5" x2="40" y2="45" stroke="#4B5563" stroke-width="2"/><rect x="8" y="5" width="64" height="7" fill="#4B5563" rx="2"/></svg>`,

  shoes:`<svg viewBox="0 0 90 65" width="80" xmlns="http://www.w3.org/2000/svg"><ellipse cx="28" cy="46" rx="24" ry="13" fill="#292524"/><rect x="14" y="20" width="18" height="28" rx="7" fill="#292524"/><rect x="4" y="46" width="48" height="10" rx="4" fill="#1C1917"/><ellipse cx="66" cy="46" rx="24" ry="13" fill="#292524"/><rect x="58" y="20" width="18" height="28" rx="7" fill="#292524"/><rect x="42" y="46" width="48" height="10" rx="4" fill="#1C1917"/></svg>`,

  trainers:`<svg viewBox="0 0 90 60" width="80" xmlns="http://www.w3.org/2000/svg"><path d="M4,40 Q14,20 28,22 L28,40 Z" fill="#4CAF50"/><rect x="28" y="22" width="34" height="18" rx="4" fill="#4CAF50"/><rect x="4" y="40" width="60" height="12" rx="4" fill="#2E7D32"/><line x1="32" y1="22" x2="38" y2="40" stroke="#fff" stroke-width="1.5" opacity=".5"/><line x1="40" y1="22" x2="46" y2="40" stroke="#fff" stroke-width="1.5" opacity=".5"/><line x1="48" y1="22" x2="54" y2="40" stroke="#fff" stroke-width="1.5" opacity=".5"/></svg>`,
  hat:`<svg viewBox="0 0 80 65" width="70" xmlns="http://www.w3.org/2000/svg"><ellipse cx="40" cy="50" rx="38" ry="13" fill="#F97316"/><rect x="22" y="14" width="36" height="38" rx="7" fill="#F97316"/><rect x="22" y="32" width="36" height="7" fill="#EA580C"/></svg>`,
  dress:`<svg viewBox="0 0 80 95" width="70" xmlns="http://www.w3.org/2000/svg"><path d="M28,8 L18,25 L22,28 L18,90 L62,90 L58,28 L62,25 L52,8 Q40,14 28,8Z" fill="#D946EF"/><ellipse cx="40" cy="8" rx="12" ry="7" fill="#111" stroke="#D946EF" stroke-width="2"/><line x1="20" y1="46" x2="60" y2="46" stroke="#A21CAF" stroke-width="2"/></svg>`
};

/* VOCAB SVGs — clearer designs */
const vocabSVG={
  probably:`<svg viewBox="0 0 100 90" width="120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="40" cy="62" r="22" fill="#FFD400"/>
    <rect x="28" y="54" width="24" height="4" rx="2" fill="#111"/>
    <circle cx="34" cy="50" r="3" fill="#111"/><circle cx="46" cy="50" r="3" fill="#111"/>
    <ellipse cx="72" cy="24" rx="26" ry="17" fill="#333" stroke="#FFD400" stroke-width="2"/>

/* POPUP */
let popupCloseCb=null;
function openPopup(svgHtml,word,q,onClose){
  document.getElementById('popupQ').textContent=q||'What is this?';
  document.getElementById('popupSvg').innerHTML=svgHtml;
  document.getElementById('popupWord').style.display='none';
  document.getElementById('popupWord').textContent=word;
  document.getElementById('popupReveal').style.display='inline-block';
  popupCloseCb=onClose;
  document.getElementById('overlay').style.display='block';
  document.getElementById('popup').style.display='block';
}
function revealPopupWord(){document.getElementById('popupWord').style.display='block';document.getElementById('popupReveal').style.display='none';}
function closePopup(){document.getElementById('overlay').style.display='none';document.getElementById('popup').style.display='none';if(popupCloseCb)popupCloseCb();popupCloseCb=null;}

/* BOARD */
function makeBoard(words,svgMap,cols,q){
  const opened=new Set();
  const wrap=document.createElement('div');wrap.className='board-wrap';
  const grid=document.createElement('div');grid.className='board-grid';grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  const foot=document.createElement('div');foot.className='board-footer';
  const cnt=document.createElement('span');cnt.className='board-count';
  const rst=document.createElement('button');rst.className='board-reset';rst.textContent='↺ Reset';
  function render(){
    grid.innerHTML='';
    words.forEach((w,i)=>{
      const c=document.createElement('div');
      const isOpen=opened.has(i);
      c.className='flip-card'+(isOpen?' open':'');
      c.innerHTML=isOpen?svgMap[w]+`<div class="card-word">${w}</div>`:`<div class="q-mark">?</div>`;
      c.onclick=()=>openPopup(svgMap[w].replace(/width="\d+"/,'width="160"'),w,q,()=>{opened.add(i);render();});
      grid.appendChild(c);
    });
    cnt.textContent=opened.size+' / '+words.length+' opened';
  }
  rst.onclick=()=>{opened.clear();render();};
  foot.appendChild(cnt);foot.appendChild(rst);
  wrap.appendChild(grid);wrap.appendChild(foot);
  render();return wrap;
}

function swTab(el,n){
  const bar=el.parentElement;
  const wrap=bar.parentElement;
  bar.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  wrap.querySelectorAll('.tab-pane').forEach((p,i)=>p.classList.toggle('active',i===n));
}

function mcAnswer(btn,correct){
  if(btn.classList.contains('correct')||btn.classList.contains('wrong')) return;
  const grp=btn.closest('.mc-opts');
  grp.querySelectorAll('.mc-opt').forEach(b=>b.onclick=null);
  btn.classList.add(correct?'correct':'wrong');
  if(!correct) grp.querySelector('[data-correct="1"]').classList.add('correct');
}

            <div class="match-item"><span class="match-num">2</span><span class="match-text">She starts work at 8 a.m. and</span></div>
            <div class="match-item"><span class="match-num">3</span><span class="match-text">She's got a lot of money, but</span></div>
            <div class="match-item"><span class="match-num">4</span><span class="match-text">She works in a clothes shop in the day and</span></div>
            <div class="match-item"><span class="match-num">5</span><span class="match-text">She is thirty-two years old, but</span></div>
            <div class="match-item"><span class="match-num">6</span><span class="match-text">She wears smart clothes because</span></div>
          </div>
          <div>
            <div class="match-col-head">Endings</div>
            <div class="match-item"><span class="match-num">a</span><span class="match-text">she finishes at 5 p.m.</span></div>
            <div class="match-item"><span class="match-num">b</span><span class="match-text">she lives with her parents.</span></div>
            <div class="match-item"><span class="match-num">c</span><span class="match-text">in a restaurant in the evening.</span></div>
            <div class="match-item"><span class="match-num">d</span><span class="match-text">her job is there.</span></div>
            <div class="match-item"><span class="match-num">e</span><span class="match-text">she works in a bank.</span></div>
            <div class="match-item"><span class="match-num">f</span><span class="match-text">she doesn't wear expensive clothes.</span></div>
          </div>
        </div>
      </div>`;
    el=w;
  }

  if(el) body.appendChild(el);
  document.getElementById('stepCounter').textContent=(current+1)+' / '+steps.length;
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').textContent=current===steps.length-1?'Done':'next \u2192';
}

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('outlineScreen').style.display='none';
  document.getElementById('presentScreen').style.display='flex';
  current=0;renderStep();
};
document.getElementById('nextBtn').onclick=()=>{if(current<steps.length-1){current++;renderStep();}};
document.getElementById('prevBtn').onclick=()=>{if(current>0){current--;renderStep();}};
</script>
</body>
</html>
