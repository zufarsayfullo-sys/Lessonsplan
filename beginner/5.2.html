<style>

<script>
/* FULLSCREEN */
document.getElementById('fsBtn').onclick=function(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});this.textContent='✕';}
  else{document.exitFullscreen();this.textContent='⛶';}
};
document.addEventListener('fullscreenchange',()=>{document.getElementById('fsBtn').textContent=document.fullscreenElement?'✕':'⛶';});

/* TIMER */
let tS=180,tR=false,tI=null;
function setT(m){tS=m*60;tR=false;clearInterval(tI);document.getElementById('tTog').textContent='▶';rendT();}
function rendT(){const m=Math.floor(Math.abs(tS)/60),s=Math.abs(tS)%60,n=tS<0?'-':'',d=document.getElementById('tDisp');d.textContent=n+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');d.className='td'+(tS<=30&&tS>=-999?' warn':'');}
document.getElementById('tTog').onclick=function(){if(tR){clearInterval(tI);tR=false;this.textContent='▶';}else{tR=true;this.textContent='⏸';tI=setInterval(()=>{tS--;rendT();},1000);}};
document.getElementById('tMin').onclick=()=>{tS=Math.max(0,tS-60);rendT();};
document.getElementById('tPls').onclick=()=>{tS+=60;rendT();};

/* PDF */
function savePDF(el,name){
  html2pdf().set({margin:10,filename:name,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).save();
}

/* TAB */
function swTab(el,n){
  const bar=el.parentElement,wrap=bar.parentElement;
  bar.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  wrap.querySelectorAll('.tpane').forEach((p,i)=>p.classList.toggle('active',i===n));
}
window.swTab=swTab;
function mcAns(btn,ok){
  if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
  const g=btn.closest('.mco');
  g.querySelectorAll('.mo').forEach(b=>b.onclick=null);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok)g.querySelector('[data-c]').classList.add('correct');
}
window.mcAns=mcAns;

/* POPUP */
let popCb=null;
function openPopup(svgHtml,word,trans,ex){
  document.getElementById('popQ').textContent='What does this word mean?';
  document.getElementById('popSvg').innerHTML=svgHtml;
  document.getElementById('popWord').style.display='none';
  document.getElementById('popWord').textContent=word;
  document.getElementById('popTrans').style.display='none';
  document.getElementById('popTrans').innerHTML=trans;
  document.getElementById('popEx').style.display='none';
  document.getElementById('popEx').textContent=ex;
  document.getElementById('popReveal').style.display='inline-block';
  document.getElementById('overlay').style.display='block';
  document.getElementById('popup').style.display='block';
}
function revealPopup(){
  document.getElementById('popWord').style.display='block';
  document.getElementById('popTrans').style.display='block';
  document.getElementById('popEx').style.display='block';
  document.getElementById('popReveal').style.display='none';
}
function closePopup(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('popup').style.display='none';
  if(popCb){popCb();popCb=null;}
}

/* BOARD */
function makeBoard(cols){
  const opened=new Set();
  const frag=document.createDocumentFragment();
  const grid=document.createElement('div');
  grid.className='board-grid';
  grid.style.gridTemplateColumns='repeat('+cols+',1fr)';
  const cntEl=document.createElement('div');
  cntEl.style.cssText='text-align:right;font-size:12px;color:#93C5FD;margin-bottom:6px;width:100%;max-width:1080px;';
  const foot=document.createElement('div');foot.className='board-foot';
  const rb=document.createElement('button');rb.className='rb';rb.textContent='↺ Reset';
  function render(){
    const allOpen=opened.size===vocab.length;
    grid.innerHTML='';
    vocab.forEach((item,i)=>{
      const isOpen=opened.has(i);
      const card=document.createElement('div');
      card.className='fc'+(isOpen?' op':'');
      if(isOpen){
        card.innerHTML=SVG[item.k].replace(/width="\d+"/,'width="55"')
          +'<div class="cw">'+item.w+'</div>'
          +(allOpen?'<div class="ct">🇷🇺 '+item.ru+'</div><div class="ct">🇺🇿 '+item.uz+'</div>':'');
      }else{
        card.innerHTML='<div class="qm">?</div>';
      }
      card.onclick=()=>{
        popCb=()=>{opened.add(i);render();};
        openPopup(
          SVG[item.k].replace(/width="\d+"/,'width="140"'),
          item.w,
          '🇷🇺 '+item.ru+'<br>🇺🇿 '+item.uz,
          item.ex
        );
      };
      grid.appendChild(card);
    });
    cntEl.textContent=opened.size+' / '+vocab.length+' opened';
  }
  rb.onclick=()=>{opened.clear();render();};
  foot.appendChild(rb);
  frag.appendChild(cntEl);
  frag.appendChild(grid);
  frag.appendChild(foot);
  render();
  return frag;
}
