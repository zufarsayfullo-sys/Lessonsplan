<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;background:#DDE6F8;min-height:100vh;display:flex;flex-direction:column;}
  a{text-decoration:none;color:inherit;}
  /* OUTLINE */
  .outline-page{flex:1;padding:24px 36px;display:flex;flex-direction:column;}
  .ol-title{color:#1D4ED8;font-size:28px;font-weight:bold;margin-bottom:4px;}
  .ol-sub{color:#666;font-size:14px;margin-bottom:24px;}
  .ol-list{display:flex;flex-direction:column;gap:8px;margin-bottom:28px;}
  .ol-item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:14px 18px;font-size:15px;color:#333;box-shadow:0 1px 4px rgba(0,0,0,.07);}
  .ol-n{background:#1D4ED8;color:#fff;border-radius:50%;width:28px;height:28px;min-width:28px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;}
  .ol-tag{margin-left:auto;color:#93C5FD;font-size:12px;}
  .sbtn{background:#1D4ED8;color:#fff;border:none;border-radius:10px;padding:14px 32px;font-weight:bold;font-size:16px;cursor:pointer;font-family:inherit;align-self:flex-end;}
  .back-link{color:#1D4ED8;font-size:18px;font-weight:bold;margin-bottom:16px;display:inline-block;}
  /* LESSON LAYOUT */
  #lessonScreen{flex:1;display:none;flex-direction:column;min-height:0;}
  .top-bar{padding:12px 32px 6px;display:flex;align-items:center;gap:14px;}
  .step-label{color:#1D4ED8;font-size:20px;font-weight:bold;}
  .content-area{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 28px;overflow-y:auto;}
  .bottom-bar{background:rgba(255,255,255,.94);border-top:2px solid #BFDBFE;padding:10px 28px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .nav-side{display:flex;align-items:center;gap:8px;}
  .nb{background:none;border:none;font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer;color:#93C5FD;padding:6px 10px;}
  .nb:disabled{opacity:.25;cursor:not-allowed;}
  .nb.pri{background:#1D4ED8;color:#fff;border-radius:8px;padding:8px 20px;}
  .sc{color:#BFDBFE;font-size:13px;min-width:60px;text-align:center;}
  .tools-side{display:flex;align-items:center;gap:8px;}
  .trec{color:#93C5FD;font-size:11px;}
  .tw0{display:flex;align-items:center;gap:4px;background:#EFF6FF;border:1.5px solid #BFDBFE;border-radius:8px;padding:5px 10px;}
  .ta{background:none;border:none;color:#1D4ED8;font-size:16px;font-weight:bold;cursor:pointer;width:22px;font-family:inherit;}
  .td{font-family:'Courier New',monospace;font-size:15px;color:#1D4ED8;min-width:52px;text-align:center;font-weight:bold;}
  .td.warn{color:#EF4444;}
  .tt{background:none;border:1.5px solid #1D4ED8;color:#1D4ED8;border-radius:5px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:inherit;margin-left:2px;}
  .hbtn{background:#1D4ED8;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:bold;cursor:pointer;font-family:inherit;}
  .pdf-btn{display:none;}
  /* FLIP BOARD */
  .board-full{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;align-items:center;}
  .board-grid{display:grid;gap:10px;width:100%;max-width:1200px;flex:1;min-height:0;}
  .fc{background:#fff;border:2px solid #BFDBFE;border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.06);min-height:0;}
  .fc:hover{border-color:#1D4ED8;box-shadow:0 2px 8px rgba(29,78,216,.15);}
  .fc.op{border-color:#1D4ED8;background:#F8FAFF;}
  .fc .qm{font-size:30px;color:#BFDBFE;}
  .fc .cw{font-size:13px;font-weight:bold;color:#1D4ED8;margin-top:5px;line-height:1.3;}
  .fc .ct{font-size:10px;color:#888;margin-top:2px;}
  .board-foot{display:flex;justify-content:flex-end;margin-top:6px;width:100%;max-width:1200px;}
  .rb{background:none;border:1.5px solid #BFDBFE;color:#1D4ED8;border-radius:6px;padding:5px 16px;font-size:12px;cursor:pointer;font-family:inherit;}
  /* OVERLAY */
  #overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:200;}
  #popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:201;background:#fff;border:3px solid #1D4ED8;border-radius:14px;padding:22px 28px;text-align:center;min-width:260px;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.2);}

  .pw{font-size:20px;font-weight:bold;color:#1D4ED8;margin-top:10px;display:none;}
  .pt{font-size:12px;color:#888;margin-top:4px;display:none;line-height:1.5;}
  .pe{background:#EFF6FF;border-left:3px solid #1D4ED8;padding:8px 12px;margin-top:10px;font-size:13px;color:#333;text-align:left;border-radius:4px;display:none;font-style:italic;}
  .pr{margin-top:12px;background:#1D4ED8;border:none;border-radius:6px;padding:8px 20px;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;color:#fff;}
  .ph2{color:#ccc;font-size:11px;margin-top:10px;}

  .tw2{width:100%;max-width:1000px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);}

  .tab.active{color:#fff;background:#1D4ED8;border-bottom:3px solid #1D4ED8;}
  .tpane{display:none;padding:20px;max-height:56vh;overflow-y:auto;}
  .tpane.active{display:block;}
  /* reading */
  .reading-title{font-size:20px;font-weight:bold;color:#1D4ED8;margin-bottom:14px;}
  .reading-text{color:#333;font-size:14px;line-height:1.85;}
  .text-item{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;padding:12px 14px;background:#F8FAFF;border-radius:8px;border-left:3px solid #1D4ED8;}
  .text-num{background:#1D4ED8;color:#fff;border-radius:50%;width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;margin-top:2px;}
  .text-body{color:#333;font-size:14px;line-height:1.8;}
  /* exercises */
  .einstr{color:#93C5FD;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;}
  .ex-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;}
  .ex-n{background:#1D4ED8;color:#fff;font-weight:bold;font-size:11px;border-radius:50%;width:20px;height:20px;min-width:20px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .ex-t{color:#333;font-size:14px;line-height:1.6;flex:1;}
  .mc-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .mo{background:#EFF6FF;border:1.5px solid #BFDBFE;color:#333;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;font-style:italic;}
  .mo:hover{border-color:#1D4ED8;color:#1D4ED8;}
  .mo.correct{background:#F0FDF4;border-color:#4CAF50;color:#166534;font-style:italic;}
  .mo.wrong{background:#FEF2F2;border-color:#EF4444;color:#991B1B;text-decoration:line-through;font-style:italic;}
  .tf-opts{display:flex;gap:8px;margin-top:6px;}
  .tf-btn{background:none;border:1.5px solid #BFDBFE;color:#666;border-radius:6px;padding:5px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
  .tf-btn:hover{border-color:#1D4ED8;color:#1D4ED8;}
  .tf-btn.correct{background:#F0FDF4;border-color:#4CAF50;color:#166534;}
  .tf-btn.wrong{background:#FEF2F2;border-color:#EF4444;color:#991B1B;}
  /* lead-in */
  .lead-card{background:#fff;border-radius:14px;padding:28px 32px;box-shadow:0 2px 12px rgba(0,0,0,.08);width:100%;max-width:760px;text-align:center;}
</style>

<script>
/* FULLSCREEN */
document.getElementById('fsBtn').onclick=function(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});this.textContent='✕';}
  else{document.exitFullscreen();this.textContent='⛶';}
};
document.addEventListener('fullscreenchange',()=>{document.getElementById('fsBtn').textContent=document.fullscreenElement?'✕':'⛶';});

/* TIMER */
let tS=180,tR=false,tI=null;
function setT(m){tS=m*60;tR=false;clearInterval(tI);document.getElementById('tTog').textContent='▶';rendT();}
function rendT(){const m=Math.floor(Math.abs(tS)/60),s=Math.abs(tS)%60,n=tS<0?'-':'',d=document.getElementById('tDisp');d.textContent=n+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');d.className='td'+(tS<=30&&tS>=-999?' warn':'');}
document.getElementById('tTog').onclick=function(){if(tR){clearInterval(tI);tR=false;this.textContent='▶';}else{tR=true;this.textContent='⏸';tI=setInterval(()=>{tS--;rendT();},1000);}};
document.getElementById('tMin').onclick=()=>{tS=Math.max(0,tS-60);rendT();};
document.getElementById('tPls').onclick=()=>{tS+=60;rendT();};

/* PDF */
function savePDF(el,name){
  html2pdf().set({margin:10,filename:name,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).save();
}
function buildPrintEl(html){
  const el=document.createElement('div');
  el.style.cssText='font-family:Arial,sans-serif;padding:20px;color:#111;max-width:740px;';
  el.innerHTML=html;document.body.appendChild(el);
  setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},8000);
  return el;
}

/* TAB */
function swTab(el,n){
  const bar=el.parentElement,wrap=bar.parentElement;
  bar.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  wrap.querySelectorAll('.tpane').forEach((p,i)=>p.classList.toggle('active',i===n));
}
window.swTab=swTab;

/* POPUP */
let popCb=null;
function openPopup(svgHtml,word,trans,ex){
  document.getElementById('popQ').textContent='What does this mean?';
  document.getElementById('popSvg').innerHTML=svgHtml;
  document.getElementById('popWord').style.display='none';
  document.getElementById('popWord').textContent=word;
  document.getElementById('popTrans').style.display='none';
  document.getElementById('popTrans').innerHTML=trans;
  document.getElementById('popEx').style.display='none';
  document.getElementById('popEx').textContent=ex;
  document.getElementById('popReveal').style.display='inline-block';
  document.getElementById('overlay').style.display='block';
  document.getElementById('popup').style.display='block';
}
function revealPopup(){
  document.getElementById('popWord').style.display='block';
  document.getElementById('popTrans').style.display='block';
  document.getElementById('popEx').style.display='block';
  document.getElementById('popReveal').style.display='none';
}
function closePopup(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('popup').style.display='none';
  if(popCb){popCb();popCb=null;}
}

/* SVGs */
const SVG={
  shawl:`<svg viewBox="0 0 100 86" width="110" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="22" r="16" fill="#FFD400"/>
    <path d="M20,38 Q10,60 18,82 L50,70 L82,82 Q90,60 80,38 Q65,28 50,38 Q35,28 20,38Z" fill="#1D4ED8" opacity=".85"/>
    <path d="M20,38 Q35,28 50,38 Q65,28 80,38" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4,3"/>
  </svg>`,
  bowlerhat:`<svg viewBox="0 0 100 78" width="110" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="58" rx="44" ry="14" fill="#1a1a1a"/>
    <rect x="22" y="22" width="56" height="38" rx="28" fill="#1a1a1a"/>
    <ellipse cx="50" cy="22" rx="28" ry="10" fill="#2a2a2a"/>
    <ellipse cx="50" cy="58" rx="44" ry="14" fill="none" stroke="#555" stroke-width="2"/>
  </svg>`,
  fake:`<svg viewBox="0 0 110 80" width="120" xmlns="http://www.w3.org/2000/svg">
    <rect x="5" y="10" width="44" height="60" rx="6" fill="#4CAF50" opacity=".15" stroke="#4CAF50" stroke-width="2"/>
    <text x="27" y="36" text-anchor="middle" font-size="9" fill="#4CAF50" font-family="Arial" font-weight="bold">REAL</text>
    <circle cx="27" cy="50" r="8" fill="#4CAF50"/>
    <rect x="61" y="10" width="44" height="60" rx="6" fill="#EF4444" opacity=".12" stroke="#EF4444" stroke-width="2"/>
    <text x="83" y="36" text-anchor="middle" font-size="9" fill="#EF4444" font-family="Arial" font-weight="bold">FAKE</text>
    <circle cx="83" cy="50" r="8" fill="#EF4444" opacity=".6"/>
    <line x1="77" y1="44" x2="89" y2="56" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="89" y1="44" x2="77" y2="56" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`,
  tan:`<svg viewBox="0 0 110 80" width="120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="40" r="24" fill="#FDE8D8" stroke="#ddd" stroke-width="2"/>

    <polygon points="64,35 76,40 64,45" fill="#1D4ED8"/>
    <circle cx="86" cy="40" r="24" fill="#C68642" stroke="#ddd" stroke-width="2"/>
    <text x="86" y="44" text-anchor="middle" font-size="9" fill="#fff" font-family="Arial">tan skin</text>

  </svg>`,
  pieceofwood:`<svg viewBox="0 0 100 80" width="110" xmlns="http://www.w3.org/2000/svg">
    <rect x="18" y="28" width="64" height="26" rx="5" fill="#92400E"/>
    <line x1="18" y1="36" x2="82" y2="36" stroke="#B45309" stroke-width="1.5"/>
    <line x1="18" y1="44" x2="82" y2="44" stroke="#B45309" stroke-width="1.5"/>
    <line x1="35" y1="28" x2="35" y2="54" stroke="#B45309" stroke-width="1"/>
    <line x1="55" y1="28" x2="55" y2="54" stroke="#B45309" stroke-width="1"/>
    <text x="50" y="72" text-anchor="middle" font-size="9" fill="#92400E" font-family="Arial">a piece of wood</text>
  </svg>`,
  barefeet:`<svg viewBox="0 0 100 86" width="110" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="32" cy="58" rx="22" ry="14" fill="#FFD400" opacity=".8"/>

    <circle cx="22" cy="24" r="5" fill="#FFD400"/>

  strange:`<svg viewBox="0 0 100 80" width="110" xmlns="http://www.w3.org/2000/svg">

    <text x="20" y="22" font-size="20" fill="#FFD400" font-family="Arial" font-weight="bold">?</text>
  </svg>`
};

const vocab=[
  {w:'shawl',         ru:'шаль',              uz:'ro\'mol',          k:'shawl',       ex:'"Chola women wear a shawl around their body when it is cold."'},
  {w:'bowler hat',    ru:'котелок (шляпа)',    uz:'dumaloq shapka',   k:'bowlerhat',   ex:'"Chola women are famous for their bowler hats."'},
  {w:'fake',          ru:'ненастоящий',        uz:'soxta',            k:'fake',        ex:'"People use fake tan — it\'s not real sun, it comes from a bottle."'},
  {w:'tan',           ru:'загар / коричневый', uz:'qoʻngʻir teri',   k:'tan',         ex:'"People put fake tan on their skin to look brown."'},
  {w:'a piece of wood', ru:'кусок дерева',    uz:'yog\'och parchasi', k:'pieceofwood', ex:'"The Miao women put a piece of wood on their heads and wrap their hair around it."'},
  {w:'walk bare feet', ru:'ходить босиком',   uz:'yalangoyoq yurmoq', k:'barefeet',   ex:'"In New Zealand, children walk bare feet in the street."'},
  {w:'strange',       ru:'странный',           uz:'g\'alati',         k:'strange',     ex:'"It is strange to see people without shoes in the street."'},
];

/* BOARD */
function makeBoard(){
  const opened=new Set();
  const wrap=document.createElement('div');wrap.className='board-full';
  const cnt=document.createElement('div');cnt.style.cssText='text-align:right;font-size:12px;color:#93C5FD;margin-bottom:6px;width:100%;max-width:1200px;';
  const grid=document.createElement('div');grid.className='board-grid';
  grid.style.gridTemplateColumns='repeat(4,1fr)';
  grid.style.gridAutoRows='1fr';
  grid.style.flex='1';
  const foot=document.createElement('div');foot.className='board-foot';
  const rb=document.createElement('button');rb.className='rb';rb.textContent='↺ Reset';
  function render(){
    const allOpen=opened.size===vocab.length;
    grid.innerHTML='';
    vocab.forEach((item,i)=>{
      const isOpen=opened.has(i);
      const card=document.createElement('div');
      card.className='fc'+(isOpen?' op':'');
      card.style.minHeight='0';
      if(isOpen){
        card.innerHTML=SVG[item.k].replace(/width="\d+"/,'width="65"')
          +'<div class="cw">'+item.w+'</div>'
          +(allOpen?'<div class="ct">🇷🇺 '+item.ru+'</div><div class="ct">🇺🇿 '+item.uz+'</div>':'');
      }else{card.innerHTML='<div class="qm">?</div>';}
      card.onclick=()=>{
        popCb=()=>{opened.add(i);render();};
        openPopup(SVG[item.k].replace(/width="\d+"/,'width="140"'),item.w,'🇷🇺 '+item.ru+'<br>🇺🇿 '+item.uz,item.ex);
      };
      grid.appendChild(card);
    });
    cnt.textContent=opened.size+' / '+vocab.length+' opened';
  }
  rb.onclick=()=>{opened.clear();render();};
  foot.appendChild(rb);
  wrap.appendChild(cnt);wrap.appendChild(grid);wrap.appendChild(foot);
  render();return wrap;
}

/* HELPERS */
function mcAns(btn,ok){
  if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
  const g=btn.closest('.mc-opts');g.querySelectorAll('.mo').forEach(b=>b.onclick=null);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok)g.querySelector('[data-c]').classList.add('correct');
}
function tfAns(btn,ok){
  if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
  const g=btn.closest('.tf-opts');g.querySelectorAll('.tf-btn').forEach(b=>b.onclick=null);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok)g.querySelectorAll('.tf-btn').forEach(b=>{if(b!==btn)b.classList.add('correct');});
}
window.mcAns=mcAns;window.tfAns=tfAns;
