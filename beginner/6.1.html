<script>
/* FULLSCREEN */
document.getElementById('fsBtn').onclick=function(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});this.textContent='✕';}
  else{document.exitFullscreen();this.textContent='⛶';}
};
document.addEventListener('fullscreenchange',()=>{document.getElementById('fsBtn').textContent=document.fullscreenElement?'✕':'⛶';});

/* TIMER */
let tS=300,tR=false,tI=null;
function setT(m){tS=m*60;tR=false;clearInterval(tI);document.getElementById('tTog').textContent='▶';rendT();}
function rendT(){const m=Math.floor(Math.abs(tS)/60),s=Math.abs(tS)%60,n=tS<0?'-':'',d=document.getElementById('tDisp');d.textContent=n+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');d.className='td'+(tS<=30&&tS>=-999?' warn':'');}
document.getElementById('tTog').onclick=function(){if(tR){clearInterval(tI);tR=false;this.textContent='▶';}else{tR=true;this.textContent='⏸';tI=setInterval(()=>{tS--;rendT();},1000);}};
document.getElementById('tMin').onclick=()=>{tS=Math.max(0,tS-60);rendT();};
document.getElementById('tPls').onclick=()=>{tS+=60;rendT();};

/* POPUP */
let popCb=null;
function openPopup(svgHtml,word,trans,ex){
  document.getElementById('popQ').textContent='What does this word/phrase mean?';
  document.getElementById('popSvg').innerHTML=svgHtml;
  document.getElementById('popWord').style.display='none';
  document.getElementById('popWord').textContent=word;
  document.getElementById('popTrans').style.display='none';
  document.getElementById('popTrans').innerHTML=trans;
  document.getElementById('popEx').style.display='none';
  document.getElementById('popEx').textContent=ex;
  document.getElementById('popReveal').style.display='inline-block';
  document.getElementById('overlay').style.display='block';
  document.getElementById('popup').style.display='block';
}
function revealPopup(){
  document.getElementById('popWord').style.display='block';
  document.getElementById('popTrans').style.display='block';
  document.getElementById('popEx').style.display='block';
  document.getElementById('popReveal').style.display='none';
}
function closePopup(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('popup').style.display='none';
  if(popCb){popCb();popCb=null;}
}

/* ── SVGs ── */
const SVG={
  like:`<svg viewBox="0 0 100 80" width="110" xmlns="http://www.w3.org/2000/svg"><path d="M50 70 C50 70 15 45 15 25 A 15 15 0 0 1 45 15 A 10 10 0 0 1 50 20 A 10 10 0 0 1 55 15 A 15 15 0 0 1 85 25 C 85 45 50 70 50 70 Z" fill="#1D4ED8" stroke="#BFDBFE" stroke-width="2"/><text x="50" y="42" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff" font-family="Arial">LIKE</text></svg>`,
  facilities:`<svg viewBox="0 0 100 80" width="110" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="15" width="30" height="20" rx="4" fill="#34D399"/><text x="30" y="28" text-anchor="middle" font-size="7" font-weight="bold" fill="#fff" font-family="Arial">GYM</text><rect x="55" y="15" width="30" height="20" rx="4" fill="#60A5FA"/><text x="70" y="28" text-anchor="middle" font-size="7" font-weight="bold" fill="#fff" font-family="Arial">POOL</text><rect x="35" y="45" width="30" height="20" rx="4" fill="#F87171"/><text x="50" y="58" text-anchor="middle" font-size="7" font-weight="bold" fill="#fff" font-family="Arial">CLINIC</text></svg>`,
  aswellas:`<svg viewBox="0 0 100 80" width="110" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="40" r="14" fill="#1D4ED8" opacity="0.8"/><text x="30" y="44" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Arial">A</text><circle cx="70" cy="40" r="14" fill="#1D4ED8" opacity="0.8"/><text x="70" y="44" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Arial">B</text><path d="M 44 40 L 56 40" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/><path d="M 50 34 L 50 46" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/></svg>`,
  lucky:`<svg viewBox="0 0 100 80" width="110" xmlns="http://www.w3.org/2000/svg"><path d="M 50 15 C 30 15, 30 50, 50 50 C 70 50, 70 15, 50 15 Z" fill="none" stroke="#FFD400" stroke-width="6"/><circle cx="35" cy="30" r="6" fill="#34D399"/><circle cx="65" cy="30" r="6" fill="#34D399"/><circle cx="50" cy="45" r="7" fill="#60A5FA"/><text x="50" y="70" text-anchor="middle" font-size="9" font-weight="bold" fill="#1D4ED8" font-family="Arial">LUCKY</text></svg>`,
  bakery:`<svg viewBox="0 0 100 80" width="110" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="30" width="60" height="35" rx="5" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><path d="M 15 30 L 35 15 L 65 15 L 85 30 Z" fill="#FFD400" stroke="#B45309" stroke-width="2"/><text x="50" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#B45309" font-family="Arial">BREAD</text></svg>`,

  twohours:`<svg viewBox="0 0 100 80" width="110" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="40" r="30" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="3"/><line x1="50" y1="40" x2="50" y2="20" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="40" x2="68" y2="40" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round"/><text x="50" y="77" text-anchor="middle" font-size="9" font-weight="bold" fill="#1D4ED8" font-family="Arial">2 HOURS</text></svg>`
};

const vocabList=[
  {w:'like (preposition)', ru:'как / подобно',   uz:'singari / kabi',    k:'like',       ex:'"A great place for old people like Jack."'},
  {w:'facilities',         ru:'удобства / услуги', uz:'qulayliklar',       k:'facilities', ex:'"The town has facilities like museums and cinemas."'},
  {w:'as well as',         ru:'также как и',       uz:'shuningdek',        k:'aswellas',   ex:'"There is Carnegie Hall as well as many old buildings."'},
  {w:'lucky',              ru:'везучий / удачливый', uz:'omadli',          k:'lucky',      ex:'"We are very lucky to live in a beautiful place."'},
  {w:'bakery',             ru:'пекарня',           uz:'novvoyxona',        k:'bakery',     ex:'"There is an amazing bakery with delicious bread."'},
  {w:'visitors',           ru:'посетители',        uz:'tashrif buyuruvchilar', k:'visitors',ex:'"Lewisburg has a lot of visitors and nine hotels."'},
  {w:'golf course',        ru:'поле для гольфа',   uz:'golf maydoni',      k:'golfcourse', ex:'"There is a golf course near the town."'},
  {w:'two hours away',     ru:'в двух часах езды', uz:'ikki soatlik yo'l',  k:'twohours',   ex:'"The sea is only two hours away by car."'}
];

/* BOARD GENERATION */
function makeBoard(vocab,cols){
  const opened=new Set();
  const wrap=document.createElement('div');wrap.className='board-full';
  const cnt=document.createElement('div');cnt.style.cssText='text-align:right;font-size:12px;color:#1D4ED8;margin-bottom:6px;width:100%;max-width:1200px;font-weight:bold;';
  const grid=document.createElement('div');grid.className='board-grid';
  grid.style.gridTemplateColumns='repeat('+cols+',1fr)';
  grid.style.gridAutoRows='1fr';
  grid.style.flex='1';
  const foot=document.createElement('div');foot.className='board-foot';
  const rb=document.createElement('button');rb.className='rb';rb.textContent='↺ Reset';
  
  function render(){
    const allOpen=opened.size===vocab.length;
    grid.innerHTML='';
    vocab.forEach((item,i)=>{
      const isOpen=opened.has(i);
      const card=document.createElement('div');
      card.className='fc'+(isOpen?' op':'');
      card.style.minHeight='0';
      
      // Always show word header on the screen so students can see target vocabulary easily while interacting!
      card.innerHTML = `<div class="term-header">${item.w}</div>`;
      
      if(isOpen){
        card.innerHTML += (SVG[item.k]||'').replace(/width="\d+"/,'width="60"')
          + '<div class="cw" style="margin-top:15px;">' + item.w + '</div>'
          + '<div class="ct">🇷🇺 ' + item.ru + '</div><div class="ct">🇺🇿 ' + item.uz + '</div>';
      }else{
        card.innerHTML += '<div class="qm" style="margin-top:15px;">?</div>';
      }
      
      card.onclick=()=>{
        popCb=()=>{opened.add(i);render();};
        openPopup((SVG[item.k]||'').replace(/width="\d+"/,'width="140"'),item.w,'🇷🇺 '+item.ru+'<br>🇺🇿 '+item.uz,item.ex);
      };
      grid.appendChild(card);
    });
    cnt.textContent=opened.size+' / '+vocab.length+' cards opened';
  }
  rb.onclick=()=>{opened.clear();render();};
  foot.appendChild(rb);wrap.appendChild(cnt);wrap.appendChild(grid);wrap.appendChild(foot);
  render();return wrap;
}

/* STEPS */
const steps=[
  {label:'Lead-in — City Discussion', type:'leadin', rec:5},
  {label:'Pre-teach Vocabulary', type:'preteach', rec:10},
  {label:'Reading & Exercises', type:'reading-pane', rec:15}
];
let cur=0;

/* EXERCISE ANSWERS & INTERACTION LOGIC */
const answers_ex1 = {
  q1: 'Lewisburg',
  q2: 'Mt. Angel',
  q3: 'Lewisburg',
  q4: 'Mt. Angel',
  q5: 'Lewisburg',
  q6: 'Mt. Angel'
};

const answers_ex2 = {
  q1: 'True',
  q2: 'False',
  q3: 'False',
  q4: 'True',
  q5: 'True'
};

function handleEx1(btn, qKey, selectedValue) {
  const isCorrect = answers_ex1[qKey] === selectedValue;
  const parent = btn.parentElement;
  parent.querySelectorAll('.opt-btn').forEach(b => {
    b.classList.remove('correct', 'wrong');
    b.disabled = true;
  });
  if (isCorrect) {
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    // Highlight correct one
    parent.querySelectorAll('.opt-btn').forEach(b => {
      if (b.getAttribute('data-val') === answers_ex1[qKey]) b.classList.add('correct');
    });
  }
}

function handleEx2(btn, qKey, selectedValue) {
  const isCorrect = answers_ex2[qKey] === selectedValue;
  const parent = btn.parentElement;
  parent.querySelectorAll('.opt-btn').forEach(b => {
    b.classList.remove('correct', 'wrong');
    b.disabled = true;
  });
  if (isCorrect) {
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    parent.querySelectorAll('.opt-btn').forEach(b => {
      if (b.getAttribute('data-val') === answers_ex2[qKey]) b.classList.add('correct');
    });
  }
}
