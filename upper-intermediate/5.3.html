<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 5.3 - Right brain, left brain?</title>
<style>
  :root {
    --yellow: #FFD400;
    --yellow-dark: #E6BF00;
    --black: #111111;
    --black-soft: #1a1a1a;
    --gray-border: #333333;
    --gray-text: #999999;
    --gray-light: #cccccc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--black);
    color: #eee;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--yellow); }

  /* ── TOP BAR ── */
  #topbar {
    background: var(--black-soft);
    border-bottom: 2px solid var(--yellow);
    padding: 10px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  #topbar a { font-size: 20px; font-weight: bold; text-decoration: none; }
  #topbar .lesson-title { color: var(--yellow); font-weight: bold; font-size: 16px; }
  #topbar .section-name { color: var(--gray-text); font-size: 13px; margin-left: auto; }

  /* ── MAIN AREA ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  /* ── OUTLINE ── */
  #outline-screen {
    justify-content: center;
    align-items: center;
    padding: 40px 28px;
  }
  .outline-card {
    width: 100%;
    max-width: 520px;
  }
  .outline-title {
    color: var(--yellow);
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .outline-sub {
    color: var(--gray-text);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .outline-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
  }
  .outline-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--black-soft);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 15px;
  }
  .outline-item .num {
    background: #333;
    color: var(--yellow);
    border-radius: 50%;
    width: 26px; height: 26px;
    min-width: 26px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold;
  }
  .outline-item .detail {
    margin-left: auto;
    color: var(--gray-text);
    font-size: 12px;
  }
  .btn-start {
    background: var(--yellow);
    color: var(--black);
    border: none;
    border-radius: 8px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    float: right;
  }
  .btn-start:hover { background: var(--yellow-dark); }

  /* ── PRESENTATION WRAPPER ── */
  #present-screen { flex: 1; overflow: hidden; }
  #present-wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  #section-header {
    background: var(--yellow);
    color: var(--black);
    padding: 12px 28px;
    font-weight: bold;
    font-size: 15px;
    flex-shrink: 0;
  }
  #step-body {
    flex: 1;
    overflow-y: auto;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  #step-footer {
    background: var(--black-soft);
    border-top: 1px solid var(--gray-border);
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .nav-btn {
    background: none;
    border: none;
    color: var(--gray-text);
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    padding: 8px 0;
  }
  .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }
  .nav-btn.primary {
    background: var(--yellow);
    color: var(--black);
    border-radius: 6px;
    padding: 10px 24px;
  }
  .nav-btn.primary:hover { background: var(--yellow-dark); }
  .step-counter { color: #666; font-size: 13px; }

  /* ── CONTENT TYPES ── */
  .big-text {
    font-size: 48px;
    color: var(--yellow);
    font-weight: bold;
    text-align: center;
  }
  .image-box {
    width: 100%;
    max-width: 640px;
    height: min(52vh, 420px);
    background: #000;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #333;
    overflow: hidden;
  }
  .image-box img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .question-box {
    background: var(--black);
    border-left: 4px solid var(--yellow);
    padding: 14px 20px;
    color: var(--gray-light);
    font-size: 18px;
    width: 100%;
    max-width: 640px;
    margin-top: 20px;
    text-align: left;
  }

  /* vocab */
  .vocab-card {
    width: 100%;
    max-width: 560px;
    text-align: left;
  }
  .vocab-word {
    font-size: 36px;
    color: var(--yellow);
    font-weight: bold;
    margin-bottom: 12px;
  }
  .vocab-def {
    color: #eee;
    font-size: 16px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .vocab-example {
    background: var(--black);
    border-left: 4px solid var(--yellow);
    padding: 12px 16px;
    color: var(--gray-light);
    font-size: 15px;
    font-style: italic;
  }

  /* brain sort */
  .sort-wrap { width: 100%; max-width: 640px; }
  .sort-cols { display: flex; gap: 20px; margin-bottom: 16px; }
  .sort-col { flex: 1; }
  .sort-col-title {
    color: var(--yellow);
    font-weight: bold;
    font-size: 13px;
    text-align: center;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .sort-col-items { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
  .sort-placed {
    background: var(--yellow);
    color: var(--black);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
  }
  .sort-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .sort-chip {
    background: var(--black-soft);
    border: 2px solid var(--yellow);
    color: var(--yellow);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .sort-chip:hover { background: var(--yellow); color: var(--black); }
  .sort-hint { color: var(--gray-text); font-size: 12px; text-align: center; margin-bottom: 12px; }

  /* reading tabs */
  .reading-wrap { width: 100%; max-width: 700px; align-self: center; }
  .reading-tabs { display: flex; border-bottom: 1px solid var(--gray-border); margin-bottom: 0; }
  .reading-tab {
    flex: 1; padding: 10px 6px;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    color: var(--gray-text);
    background: var(--black-soft);
    border-bottom: 3px solid transparent;
    transition: all .15s;
  }
  .reading-tab.active {
    color: var(--yellow);
    border-bottom: 3px solid var(--yellow);
    background: var(--black-soft);
  }
  .reading-pane { display: none; padding: 20px 0; max-height: calc(100vh - 260px); overflow-y: auto; }
  .reading-pane.active { display: block; }
  .reading-passage { color: #eee; font-size: 14.5px; line-height: 1.9; }
  .reading-passage p { margin-bottom: 12px; }
  .reading-passage b { color: var(--yellow); }
  .q-list { display: flex; flex-direction: column; gap: 14px; }
  .q-item { display: flex; gap: 12px; }
  .q-num { color: var(--yellow); font-weight: bold; min-width: 20px; font-size: 15px; }
  .q-text { color: #eee; font-size: 15px; line-height: 1.5; }
  .tf-item { display: flex; gap: 12px; align-items: flex-start; }
  .tf-line { border-bottom: 1px solid #555; min-width: 80px; margin-top: 6px; }
  .pane-label { color: var(--gray-text); font-size: 12px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: .05em; }
  .print-btn {
    background: var(--black);
    color: var(--yellow);
    border: 2px solid var(--yellow);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    margin-left: auto;
  }
  .print-btn:hover { background: var(--yellow); color: var(--black); }
  .reading-header-row {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
  }
  .reading-title {
    color: var(--yellow);
    font-size: 20px;
    font-weight: bold;
  }

  /* ── PRINT STYLES ── */
  @media print {
    body { background: #fff; color: #000; height: auto; }
    #topbar, #step-footer, .reading-tabs, .print-btn, .reading-header-row .print-btn { display: none !important; }
    .screen, #present-screen, #present-wrap, #step-body { display: block !important; height: auto; overflow: visible; }
    #outline-screen { display: none !important; }
    .reading-wrap { max-width: 100%; }
    .reading-pane { display: block !important; max-height: none; page-break-inside: avoid; }
    .reading-passage b { color: #000; font-weight: bold; }
    .reading-title { color: #000; }
    .sort-wrap, .vocab-card, .big-text, .image-box { display: none !important; }
    #section-header { background: #000; color: #fff; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <a href="index.html">&#8592;</a>
  <span class="lesson-title">Lesson 5.3 &middot; Right brain, left brain?</span>
  <span class="section-name" id="section-name"></span>
</div>

<!-- MAIN -->
<div id="main">

  <!-- OUTLINE -->
  <div class="screen active" id="outline-screen">
    <div class="outline-card">
      <div class="outline-title">Lesson 5.3</div>
      <div class="outline-sub">Upper-Intermediate &middot; Unit 5</div>
      <div class="outline-list">
        <div class="outline-item"><span class="num">1</span> Lead-in <span class="detail">3 steps</span></div>
        <div class="outline-item"><span class="num">2</span> Pre-teach vocabulary <span class="detail">9 words</span></div>
        <div class="outline-item"><span class="num">3</span> Reading <span class="detail">text + 3 tasks</span></div>
      </div>
      <button class="btn-start" id="startBtn">Start lesson &#8594;</button>
    </div>
  </div>

  <!-- PRESENTATION -->
  <div class="screen" id="present-screen">
    <div id="present-wrap">
      <div id="section-header"></div>
      <div id="step-body"></div>
      <div id="step-footer">
        <button class="nav-btn" id="prevBtn">&#8592; prev</button>
        <span class="step-counter" id="stepCounter"></span>
        <button class="nav-btn primary" id="nextBtn">next &#8594;</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   STEPS
   brain photo: uses brain.jpg (already in your repo)
============================================================ */
const steps = [

  /* ── LEAD-IN ── */
  { section: 'Lead-in', type: 'text', content: 'Books closed' },
  { section: 'Lead-in', type: 'image', content: 'brain.jpg' },
  {
    section: 'Lead-in', type: 'brain-sort',
    content: [
      { t: 'thinking logically',              side: 'left' },
      { t: 'spelling',                         side: 'left' },
      { t: 'understanding jokes',              side: 'left' },
      { t: 'controlling the right half of your body', side: 'left' },
      { t: 'hearing the rhythm of music',      side: 'right' },
      { t: 'recognizing objects',              side: 'right' },
      { t: 'appreciating the melody of music', side: 'right' }
    ]
  },

  /* ── VOCABULARY ── */
  { section: 'Pre-teach vocabulary', type: 'vocab', content: { w: 'dominate', d: 'to be the strongest or most important influence over something', e: '"In this team, she tends to dominate every discussion."' } },
  { section: 'Pre-teach vocabulary', type: 'vocab', content: { w: 'neuroscientist', d: 'a scientist who studies the brain and nervous system', e: '"Neuroscientists are still discovering how memory works."' } },
  { section: 'Pre-teach vocabulary', type: 'vocab', content: { w: 'self-help', d: 'helping yourself improve, without relying on a professional', e: '"He read a self-help book about building confidence."' } },
  { section: 'Pre-teach vocabulary', type: 'vocab', content: { w: 'convert', d: 'to persuade someone to change their belief or behavior', e: '"The talk converted many skeptics into believers."' } },
  { section: 'Pre-teach vocabulary', type: 'vocab', content: { w: 'process (verb)', d: 'to deal with or make sense of information mentally', e: '"It takes the brain milliseconds to process a sound."' } },
  { section: 'Pre-teach vocabulary', type: 'vocab', content: { w: 'intonation', d: 'the rise and fall of the voice when speaking', e: '"Her intonation made the question sound sarcastic."' } },
  { section: 'Pre-teach vocabulary', type: 'vocab', content: { w: 'estimate (verb)', d: 'to roughly calculate or judge a value or amount', e: '"Can you estimate how many people are in the room?"' } },
  { section: 'Pre-teach vocabulary', type: 'vocab', content: { w: 'due to the fact that', d: 'a formal way of saying "because"', e: '"The trip was cancelled due to the fact that it was raining."' } },
  { section: 'Pre-teach vocabulary', type: 'vocab', content: { w: 'a load of nonsense', d: 'informal way of saying something is completely untrue', e: '"That theory is a load of nonsense."' } },

  /* ── READING ── */
  { section: 'Reading', type: 'reading', content: null }
];

let current = 0;

/* ── RENDERERS ── */
function render() {
  const s = steps[current];
  document.getElementById('section-header').textContent = 'Lesson 5.3 \u00b7 ' + s.section;
  document.getElementById('section-name').textContent = s.section;
  document.getElementById('stepCounter').textContent = (current + 1) + ' / ' + steps.length;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').textContent = current === steps.length - 1 ? 'finish' : 'next \u2192';

  const body = document.getElementById('step-body');
  body.innerHTML = '';
  body.style.justifyContent = 'center';

  if (s.type === 'text') {
    body.innerHTML = '<div class="big-text">' + s.content + '</div>';

  } else if (s.type === 'image') {
    body.innerHTML = '<div class="image-box"><img src="' + s.content + '" alt="" onerror="this.parentElement.innerHTML=\'<span style=&quot;color:#e24b4a;font-size:13px;padding:20px;text-align:center;&quot;>Image not found.<br>Make sure brain.jpg is in the upper-intermediate/ folder.</span>\'"></div>';

  } else if (s.type === 'brain-sort') {
    body.style.justifyContent = 'flex-start';
    const items = s.content;
    const wrap = document.createElement('div');
    wrap.className = 'sort-wrap';

    wrap.innerHTML = '<div class="sort-cols"><div class="sort-col"><div class="sort-col-title">Left Brain</div><div class="sort-col-items" id="leftCol"></div></div><div class="sort-col"><div class="sort-col-title">Right Brain</div><div class="sort-col-items" id="rightCol"></div></div></div><div class="sort-hint">Click a function to sort it into left or right brain</div><div class="sort-pool" id="sortPool"></div>';
    body.appendChild(wrap);

    items.forEach(function(item) {
      const chip = document.createElement('div');
      chip.className = 'sort-chip';
      chip.textContent = item.t;
      chip.onclick = function() {
        const col = document.getElementById(item.side === 'left' ? 'leftCol' : 'rightCol');
        const placed = document.createElement('div');
        placed.className = 'sort-placed';
        placed.textContent = item.t;
        col.appendChild(placed);
        chip.remove();
      };
      document.getElementById('sortPool').appendChild(chip);
    });

  } else if (s.type === 'vocab') {
    const v = s.content;
    body.innerHTML = '<div class="vocab-card"><div class="vocab-word">' + v.w + '</div><div class="vocab-def">' + v.d + '</div><div class="vocab-example">' + v.e + '</div></div>';

  } else if (s.type === 'reading') {
    body.style.justifyContent = 'flex-start';
    body.style.alignItems = 'stretch';
    body.style.padding = '0';
    body.innerHTML = readingHTML();
    activateReadingTab(1);
  }
}

/* ── READING HTML ── */
function readingHTML() {
  return `
<div style="padding:24px 28px;flex:1;overflow:hidden;display:flex;flex-direction:column;">
  <div class="reading-header-row">
    <div class="reading-title">Right brain, left brain?</div>
    <button class="print-btn" onclick="window.print()">&#128438; Print worksheet</button>
  </div>

  <div class="reading-tabs" style="margin-top:14px;">
    <div class="reading-tab active" onclick="activateReadingTab(1)">Text</div>
    <div class="reading-tab" onclick="activateReadingTab(2)">Task</div>
    <div class="reading-tab" onclick="activateReadingTab(3)">True / False / NG</div>
    <div class="reading-tab" onclick="activateReadingTab(4)">Discuss</div>
  </div>

  <!-- TEXT -->
  <div class="reading-pane active" id="rpane1">
    <div class="reading-passage">
      <p>'Is your desk organized?' 'Do you turn your head to the right when asked a question?' 'Are you good at word puzzles?' These questions are designed to help you work out whether you are right-brained or left-brained &ndash; <b>in other words</b>, whether you are creative and thoughtful (right) or logical and analytical (left). Google 'right brain, left brain' and hundreds of online quizzes containing this kind of question will pop up.</p>
      <p>It's a shame, then, that it's all <b>a load of nonsense</b>.</p>
      <p>Recent research carried out at the University of Utah shows no evidence that one side of the brain <b>dominates</b> the other. In fact, <b>neuroscientists</b> never accepted this idea in the first place.</p>
      <p>So why is this theory so common? It all started in the 1960s when Nobel Prize winner Roger Sperry discovered that different halves of the brain controlled different activities. However, the media and popular psychologists decided to take Sperry's findings a step further. They came up with the idea that some people use the right side of their brain more while others use the left side more. This resulted in numerous <b>self-help</b> books, management training courses and apps promising to help <b>convert</b> people from left-brained to right-brained thinkers.</p>
      <p>Here's the truth: you use both parts of your brain all the time. Take language skills, for instance. While the left side deals with linguistic <b>processes</b>, such as understanding the meaning of words and sentences, the right side understands <b>intonation</b> and recognizes different voices.</p>
      <p>Likewise, with mathematical ability, your left side helps you count whereas the right side enables you to <b>estimate</b> numbers.</p>
      <p>Despite all the evidence against it, the belief that one part of the brain is dominant survived for years. This is probably <b>due to the fact that</b> human beings love labels and categories. We have a need to simplify the truth. For this reason, the right-brained/left-brained theory is unlikely to go away any time soon.</p>
    </div>
  </div>

  <!-- TASK -->
  <div class="reading-pane" id="rpane2">
    <div class="pane-label">Read the whole article and answer the questions with a partner.</div>
    <div class="q-list">
      <div class="q-item"><span class="q-num">1</span><span class="q-text">According to popular psychology, what do <em>right-brained</em> and <em>left-brained</em> mean?</span></div>
      <div class="q-item"><span class="q-num">2</span><span class="q-text">Why does the writer say that the right-brained/left-brained theory is 'a load of nonsense'?</span></div>
      <div class="q-item"><span class="q-num">3</span><span class="q-text">How do the left and right brain work together to help us a) understand language and b) do maths?</span></div>
      <div class="q-item"><span class="q-num">4</span><span class="q-text">What is the writer's prediction for the future of the right-brained/left-brained theory? Why?</span></div>
    </div>
  </div>

  <!-- T/F/NG -->
  <div class="reading-pane" id="rpane3">
    <div class="pane-label">Are these statements TRUE, FALSE, or NOT GIVEN in the article?</div>
    <div class="q-list">
      <div class="tf-item"><span class="q-num">1</span><span class="q-text" style="flex:1;">Roger Sperry himself claimed that people are either left-brained or right-brained.</span><div class="tf-line"></div></div>
      <div class="tf-item"><span class="q-num">2</span><span class="q-text" style="flex:1;">The University of Utah research proved that one side of the brain is more dominant than the other.</span><div class="tf-line"></div></div>
      <div class="tf-item"><span class="q-num">3</span><span class="q-text" style="flex:1;">The left side of the brain helps us understand the meaning of words and sentences.</span><div class="tf-line"></div></div>
      <div class="tf-item"><span class="q-num">4</span><span class="q-text" style="flex:1;">Most people who believe in the theory have personally taken an online quiz about it.</span><div class="tf-line"></div></div>
      <div class="tf-item"><span class="q-num">5</span><span class="q-text" style="flex:1;">The writer believes the right-brained/left-brained theory will disappear completely soon.</span><div class="tf-line"></div></div>
    </div>
  </div>

  <!-- DISCUSS -->
  <div class="reading-pane" id="rpane4">
    <div class="pane-label">Discuss these questions with a partner.</div>
    <div class="q-list">
      <div class="q-item"><span class="q-num">1</span><span class="q-text">Have you ever taken a right-brain/left-brain quiz? Did you believe the result?</span></div>
      <div class="q-item"><span class="q-num">2</span><span class="q-text">Why do you think people enjoy putting themselves into categories like 'creative' or 'logical'?</span></div>
      <div class="q-item"><span class="q-num">3</span><span class="q-text">Can you think of other popular beliefs that science has proven to be false?</span></div>
      <div class="q-item"><span class="q-num">4</span><span class="q-text">Do you consider yourself more creative or more logical? Give examples from your life.</span></div>
    </div>
  </div>
</div>`;
}

function activateReadingTab(n) {
  document.querySelectorAll('.reading-tab').forEach(function(t, i) {
    t.classList.toggle('active', i === n - 1);
  });
  document.querySelectorAll('.reading-pane').forEach(function(p, i) {
    p.classList.toggle('active', i === n - 1);
  });
}

/* ── NAV ── */
document.getElementById('startBtn').onclick = function() {
  document.getElementById('outline-screen').classList.remove('active');
  document.getElementById('present-screen').classList.add('active');
  current = 0;
  render();
};

document.getElementById('nextBtn').onclick = function() {
  if (current < steps.length - 1) { current++; render(); }
};

document.getElementById('prevBtn').onclick = function() {
  if (current > 0) { current--; render(); }
};
</script>

</body>
</html>
