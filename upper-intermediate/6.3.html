<script>
/* FULLSCREEN */
document.getElementById('fsBtn').onclick=function(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});this.textContent='✕';}
  else{document.exitFullscreen();this.textContent='⛶';}
};
document.addEventListener('fullscreenchange',()=>{document.getElementById('fsBtn').textContent=document.fullscreenElement?'✕':'⛶';});

/* TIMER */
let tS=300,tR=false,tI=null;
function setT(m){tS=m*60;tR=false;clearInterval(tI);document.getElementById('tTog').textContent='▶';rendT();}
function rendT(){const m=Math.floor(Math.abs(tS)/60),s=Math.abs(tS)%60,n=tS<0?'-':'',d=document.getElementById('tDisp');d.textContent=n+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');d.className='td'+(tS<=30&&tS>=-999?' warn':'');}
document.getElementById('tTog').onclick=function(){if(tR){clearInterval(tI);tR=false;this.textContent='▶';}else{tR=true;this.textContent='⏸';tI=setInterval(()=>{tS--;rendT();},1000);}};
document.getElementById('tMin').onclick=()=>{tS=Math.max(0,tS-60);rendT();};
document.getElementById('tPls').onclick=()=>{tS+=60;rendT();};

/* PDF HELPER */
function savePDF(el, filename){
  html2pdf().set({
    margin:10, filename:filename,
    image:{type:'jpeg',quality:.95},
    html2canvas:{scale:2,useCORS:true},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
  }).from(el).save();
}

/* ─── POPUP ─── */
let popCb=null;
function openPopup(svgHtml,word,trans,ex,q){
  document.getElementById('popQ').textContent=q;
  document.getElementById('popSvg').innerHTML=svgHtml;
  document.getElementById('popWord').style.display='none';
  document.getElementById('popWord').textContent=word;
  document.getElementById('popTrans').style.display='none';
  document.getElementById('popTrans').innerHTML=trans;
  document.getElementById('popEx').style.display='none';
  document.getElementById('popEx').textContent=ex;
  document.getElementById('popReveal').style.display='inline-block';
  document.getElementById('overlay').style.display='block';
  document.getElementById('popup').style.display='block';
}
function revealPopup(){
  document.getElementById('popWord').style.display='block';
  document.getElementById('popTrans').style.display='block';
  document.getElementById('popEx').style.display='block';
  document.getElementById('popReveal').style.display='none';
}
function closePopup(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('popup').style.display='none';
  if(popCb){popCb();popCb=null;}
}

/* ─── BOARD BUILDER ─── */
function makeBoard(vocab,cols,svgMap,question){
  const opened=new Set();
  const wrap=document.createElement('div');wrap.className='bw';
  const head=document.createElement('div');head.className='bh';
  const htitle=document.createElement('span');htitle.textContent='Vocabulary';
  const hcnt=document.createElement('span');hcnt.className='bcnt';
  head.appendChild(htitle);head.appendChild(hcnt);
  const grid=document.createElement('div');grid.className='bg2';
  grid.style.gridTemplateColumns='repeat('+cols+',1fr)';
  const foot=document.createElement('div');foot.className='bf';
  const rst=document.createElement('button');rst.className='rb';rst.textContent='↺ Reset';
  function render(){
    const allOpen=opened.size===vocab.length;
    grid.innerHTML='';
    vocab.forEach((item,i)=>{
      const svgKey=item.svg;
      const svgHtml=svgMap[svgKey]||'<div style="color:#ccc;font-size:12px;">?</div>';
      const isOpen=opened.has(i);
      const card=document.createElement('div');
      card.className='fc'+(isOpen?' op':'');
      if(isOpen){
        card.innerHTML=svgHtml.replace(/width="\d+"/,'width="55"')
          +'<div class="cw">'+item.w+'</div>'
          +(allOpen?'<div class="ct">🇷🇺 '+item.ru+'</div><div class="ct">🇺🇿 '+item.uz+'</div>':'');
      }else{
        card.innerHTML='<div class="qm">?</div>';
      }
      card.onclick=()=>{
        popCb=()=>{opened.add(i);render();};
        openPopup(
          svgHtml.replace(/width="\d+"/,'width="140"'),
          item.w,
          '🇷🇺 '+item.ru+'<br>🇺🇿 '+item.uz,
          item.ex,
          question
        );
      };
      grid.appendChild(card);
    });
    hcnt.textContent=opened.size+' / '+vocab.length+' opened';
  }
  rst.onclick=()=>{opened.clear();render();};
  foot.appendChild(rst);
  wrap.appendChild(head);wrap.appendChild(grid);wrap.appendChild(foot);
  render();
  return wrap;
}

function buildPrintEl(html){
  const el=document.createElement('div');
  el.style.cssText='font-family:Arial,sans-serif;padding:20px;color:#111;max-width:740px;';
  el.innerHTML=html;
  document.body.appendChild(el);
  setTimeout(()=>document.body.removeChild(el),5000);
  return el;
}

/* TAB */
function swTab(el,n){
  const bar=el.parentElement,wrap=bar.parentElement;
  bar.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  wrap.querySelectorAll('.tpane').forEach((p,i)=>p.classList.toggle('active',i===n));
}
window.swTab=swTab;
function mcAns(btn,ok){
  if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
  const g=btn.closest('.mco');
  g.querySelectorAll('.mo').forEach(b=>b.onclick=null);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok)g.querySelector('[data-c]').classList.add('correct');
}
window.mcAns=mcAns;

/* COLLOC STEP */
let cIdx=0;
function buildCollocStep(){
  cIdx=0;
  const wrap=document.createElement('div');
  wrap.style.cssText='width:100%;max-width:700px;';
  const card=document.createElement('div');card.className='cs';
  const verbEl=document.createElement('div');verbEl.className='cv';
  const phraseEl=document.createElement('div');phraseEl.className='cp';
  const svgEl=document.createElement('div');svgEl.style.margin='0 auto 10px';svgEl.style.display='flex';svgEl.style.justifyContent='center';
  const qEl=document.createElement('div');qEl.className='cq';qEl.textContent='What does this phrase mean?';
  const revWrap=document.createElement('div');revWrap.className='cr-wrap';revWrap.id='cRevWrap';
  const meanEl=document.createElement('div');meanEl.className='cmean';meanEl.id='cMean';
  const exEl=document.createElement('div');exEl.className='cex';exEl.id='cEx';
  const trEl=document.createElement('div');trEl.className='ctrans2';trEl.id='cTr';
  const discEl=document.createElement('div');discEl.className='cdisc';discEl.id='cDisc';
  revWrap.appendChild(meanEl);revWrap.appendChild(exEl);revWrap.appendChild(trEl);revWrap.appendChild(discEl);
  const revBtn=document.createElement('button');
  revBtn.style.cssText='background:#1D4ED8;border:none;border-radius:6px;padding:8px 20px;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;color:#fff;margin-top:10px;';
  revBtn.textContent='Show answer ▾';revBtn.id='cRevBtn';
  revBtn.onclick=()=>{revWrap.style.display='block';revBtn.style.display='none';};
  const nav=document.createElement('div');nav.className='cn';
  const bP=document.createElement('button');bP.className='cnb';bP.textContent='← prev';bP.style.cssText='background:#EFF6FF;color:#1D4ED8;border:1.5px solid #BFDBFE;';
  const bCtr=document.createElement('span');bCtr.style.cssText='color:#BFDBFE;font-size:12px;';bCtr.id='cCtr';
  const bN=document.createElement('button');bN.className='cnb';bN.textContent='next →';bN.style.cssText='background:#1D4ED8;color:#fff;';
  function renderC(){
    const d=collocData[cIdx];
    verbEl.textContent='verb: '+d.verb;
    phraseEl.textContent=d.phrase;
    svgEl.innerHTML=d.svg;
    revWrap.style.display='none';revBtn.style.display='inline-block';
    meanEl.textContent=d.mean;exEl.textContent=d.ex;
    trEl.innerHTML='🇷🇺 '+d.ru+'<br>🇺🇿 '+d.uz;
    discEl.innerHTML='<b>Discuss:</b> '+d.disc;
    bCtr.textContent=(cIdx+1)+' / '+collocData.length;
    bP.disabled=cIdx===0;bP.style.opacity=cIdx===0?'0.3':'1';
    bN.textContent=cIdx===collocData.length-1?'Done':'next →';
  }
  bP.onclick=()=>{if(cIdx>0){cIdx--;renderC();}};
  bN.onclick=()=>{if(cIdx<collocData.length-1){cIdx++;renderC();}};
  nav.appendChild(bP);nav.appendChild(bCtr);nav.appendChild(bN);
  card.appendChild(verbEl);card.appendChild(phraseEl);card.appendChild(svgEl);card.appendChild(qEl);card.appendChild(revBtn);card.appendChild(revWrap);card.appendChild(nav);
  wrap.appendChild(card);
  renderC();
  return wrap;
}
