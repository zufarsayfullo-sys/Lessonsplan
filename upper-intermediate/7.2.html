<script>

document.getElementById('fsBtn').onclick=function(){

};
document.addEventListener('fullscreenchange',()=>{document.getElementById('fsBtn').textContent=document.fullscreenElement?'✕':'⛶';});

/* TIMER */
let tS=300,tR=false,tI=null;
function setT(m){tS=m*60;tR=false;clearInterval(tI);document.getElementById('tTog').textContent='▶';rendT();}
function rendT(){const m=Math.floor(Math.abs(tS)/60),s=Math.abs(tS)%60,n=tS<0?'-':'',d=document.getElementById('tDisp');d.textContent=n+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');d.className='td'+(tS<=30&&tS>=-999?' warn':'');}
document.getElementById('tTog').onclick=function(){if(tR){clearInterval(tI);tR=false;this.textContent='▶';}else{tR=true;this.textContent='⏸';tI=setInterval(()=>{tS--;rendT();},1000);}};
document.getElementById('tMin').onclick=()=>{tS=Math.max(0,tS-60);rendT();};
document.getElementById('tPls').onclick=()=>{tS+=60;rendT();};

  const opened=new Set();

  const cnt=document.createElement('div');cnt.style.cssText='text-align:right;font-size:12px;color:#93C5FD;margin-bottom:6px;width:100%;max-width:1200px;';
  const grid=document.createElement('div');grid.className='board-grid';
  grid.style.gridTemplateColumns='repeat(4,1fr)';grid.style.gridAutoRows='1fr';grid.style.flex='1';
  const foot=document.createElement('div');foot.className='board-foot';
  const rb=document.createElement('button');rb.className='rb';rb.textContent='↺ Reset';
  function render(){
    const allOpen=opened.size===vocab.length;grid.innerHTML='';
    vocab.forEach((item,i)=>{
      const isOpen=opened.has(i);
      const card=document.createElement('div');card.className='fc'+(isOpen?' op':'');card.style.minHeight='0';
      if(isOpen){card.innerHTML=SVG[item.k].replace(/width="\d+"/,'width="65"')+'<div class="cw">'+item.w+'</div>'+(allOpen?'<div class="ct">🇷🇺 '+item.ru+'</div><div class="ct">🇺🇿 '+item.uz+'</div>':'');}
      else{card.innerHTML='<div class="qm">?</div>';}
      card.onclick=()=>{popCb=()=>{opened.add(i);render();};openPopup(SVG[item.k].replace(/width="\d+"/,'width="140"'),item.w,'🇷🇺 '+item.ru+'<br>🇺🇿 '+item.uz,item.ex);};
      grid.appendChild(card);
    });
    cnt.textContent=opened.size+' / '+vocab.length+' opened';
  }
  rb.onclick=()=>{opened.clear();render();};
  foot.appendChild(rb);wrap.appendChild(cnt);wrap.appendChild(grid);wrap.appendChild(foot);render();return wrap;
}

/* MC/TF ANSWER */
function mcAns(btn,ok){if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;const g=btn.closest('.mc-opts');g.querySelectorAll('.mo').forEach(b=>b.onclick=null);btn.classList.add(ok?'correct':'wrong');if(!ok)g.querySelector('[data-c]').classList.add('correct');}
function tfAns(btn,ok){if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;const g=btn.closest('.tf-opts');g.querySelectorAll('.tf-btn').forEach(b=>b.onclick=null);btn.classList.add(ok?'correct':'wrong');if(!ok)g.querySelectorAll('.tf-btn').forEach(b=>{if(b!==btn)b.classList.add('correct');});}
window.mcAns=mcAns;window.tfAns=tfAns;

/* LISTENING RULES step */
const rules=[
  'I used to work somewhere where the company insisted on us parking our cars all facing the same way.',
  'We were expected to eat lunch sitting at our desks.',
  'We had to start work very early. There were always team meetings at 7.30 a.m.',
  'We were forbidden to use cups without lids.',
];
let ruleIdx=0;
function buildListenDiscuss(){
  ruleIdx=0;
  const wrap=document.createElement('div');wrap.className='rule-card';
  const counter=document.createElement('div');counter.style.cssText='color:#93C5FD;font-size:12px;margin-bottom:14px;';
  const ruleEl=document.createElement('div');ruleEl.className='rule-text';
  const qEl=document.createElement('div');qEl.className='rule-q';qEl.textContent='Why do you think the company had this rule?';
  const nav=document.createElement('div');nav.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-top:20px;';
  const bP=document.createElement('button');bP.style.cssText='background:none;border:1.5px solid #BFDBFE;color:#1D4ED8;border-radius:6px;padding:7px 16px;cursor:pointer;font-family:inherit;font-weight:bold;';bP.textContent='← prev';
  const bN=document.createElement('button');bN.style.cssText='background:#1D4ED8;color:#fff;border:none;border-radius:6px;padding:7px 18px;cursor:pointer;font-family:inherit;font-weight:bold;';bN.textContent='next →';
  function renderRule(){ruleEl.textContent=rules[ruleIdx];counter.textContent='Rule '+(ruleIdx+1)+' of '+rules.length;bP.disabled=ruleIdx===0;bP.style.opacity=ruleIdx===0?'0.3':'1';bN.textContent=ruleIdx===rules.length-1?'Done':'next →';}
  bP.onclick=()=>{if(ruleIdx>0){ruleIdx--;renderRule();}};
  bN.onclick=()=>{if(ruleIdx<rules.length-1){ruleIdx++;renderRule();}};
  nav.appendChild(bP);nav.appendChild(bN);
  wrap.appendChild(counter);wrap.appendChild(ruleEl);wrap.appendChild(qEl);wrap.appendChild(nav);
  renderRule();return wrap;
}
