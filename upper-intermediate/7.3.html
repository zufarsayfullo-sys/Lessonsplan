<script>
/* FULLSCREEN */
document.getElementById('fsBtn').onclick=function(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});this.textContent='✕';}
  else{document.exitFullscreen();this.textContent='⛶';}
};
document.addEventListener('fullscreenchange',()=>{document.getElementById('fsBtn').textContent=document.fullscreenElement?'✕':'⛶';});

/* TIMER */
let tS=300,tR=false,tI=null;
function setT(m){tS=m*60;tR=false;clearInterval(tI);document.getElementById('tTog').textContent='▶';rendT();}
function rendT(){const m=Math.floor(Math.abs(tS)/60),s=Math.abs(tS)%60,n=tS<0?'-':'',d=document.getElementById('tDisp');d.textContent=n+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');d.className='td'+(tS<=30&&tS>=-999?' warn':'');}
document.getElementById('tTog').onclick=function(){if(tR){clearInterval(tI);tR=false;this.textContent='▶';}else{tR=true;this.textContent='⏸';tI=setInterval(()=>{tS--;rendT();},1000);}};
document.getElementById('tMin').onclick=()=>{tS=Math.max(0,tS-60);rendT();};
document.getElementById('tPls').onclick=()=>{tS+=60;rendT();};

/* PDF SAVER */
function savePDF(el,name){html2pdf().set({margin:10,filename:name,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).save();}
function buildPrintEl(html){const el=document.createElement('div');el.style.cssText='font-family:Arial,sans-serif;padding:20px;color:#111;max-width:740px;';el.innerHTML=html;document.body.appendChild(el);setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},8000);return el;}

/* TABS MANAGER */
function swTab(el,n){const bar=el.parentElement,wrap=bar.parentElement;bar.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));wrap.querySelectorAll('.tpane').forEach((p,i)=>p.classList.toggle('active',i===n));}
window.swTab=swTab;

/* POPUPS */
let popCb=null;
function openPopup(svgHtml,word,trans,ex){document.getElementById('popQ').textContent='What does this mean?';document.getElementById('popSvg').innerHTML=svgHtml;document.getElementById('popWord').style.display='none';document.getElementById('popWord').textContent=word;document.getElementById('popTrans').style.display='none';document.getElementById('popTrans').innerHTML=trans;document.getElementById('popEx').style.display='none';document.getElementById('popEx').textContent=ex;document.getElementById('popReveal').style.display='inline-block';document.getElementById('overlay').style.display='block';document.getElementById('popup').style.display='block';}
function revealPopup(){document.getElementById('popWord').style.display='block';document.getElementById('popTrans').style.display='block';document.getElementById('popEx').style.display='block';document.getElementById('popReveal').style.display='none';}
function closePopup(){document.getElementById('overlay').style.display='none';document.getElementById('popup').style.display='none';if(popCb){popCb();popCb=null;}}

/* GRAPHICAL REPRESENTATION SVGs */
const SVG={
  incentive: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="#E0F2FE" stroke="#1D4ED8" stroke-width="2.5"/><path d="M35 50 L45 60 L65 40" stroke="#1D4ED8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="80" text-anchor="middle" font-size="10" fill="#1D4ED8" font-family="Arial" font-weight="bold">REWARD</text></svg>`,
  stick: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><rect x="44" y="20" width="12" height="60" rx="6" fill="#F87171" stroke="#EF4444" stroke-width="2"/><line x1="44" y1="35" x2="56" y2="35" stroke="#fff" stroke-width="2"/><line x1="44" y1="50" x2="56" y2="50" stroke="#fff" stroke-width="2"/><text x="50" y="92" text-anchor="middle" font-size="10" fill="#EF4444" font-family="Arial" font-weight="bold">PUNISH</text></svg>`,
  punishment: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><rect x="25" y="25" width="50" height="50" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/><line x1="40" y1="25" x2="40" y2="75" stroke="#EF4444" stroke-width="3"/><line x1="60" y1="25" x2="60" y2="75" stroke="#EF4444" stroke-width="3"/><line x1="25" y1="50" x2="75" y2="50" stroke="#EF4444" stroke-width="3"/></svg>`,
  judgement: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><path d="M20 50 L50 20 L80 50 Z" fill="none" stroke="#1D4ED8" stroke-width="3"/><line x1="50" y1="20" x2="50" y2="75" stroke="#1D4ED8" stroke-width="3"/><circle cx="50" cy="80" r="4" fill="#1D4ED8"/><rect x="15" y="47" width="10" height="6" fill="#1D4ED8"/><rect x="75" y="47" width="10" height="6" fill="#1D4ED8"/></svg>`,
  relyon: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><circle cx="35" cy="50" r="12" fill="#3B82F6" opacity="0.4"/><circle cx="65" cy="50" r="12" fill="#3B82F6"/><line x1="35" y1="50" x2="65" y2="50" stroke="#1D4ED8" stroke-width="4" stroke-dasharray="2 2"/></svg>`,
  endup: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><path d="M20 30 Q50 30 50 70" fill="none" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="70" r="8" fill="#1D4ED8"/><polyline points="45 60 50 70 55 60" stroke="#1D4ED8" stroke-width="3" fill="none"/></svg>`,
  selfinterest: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="30" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="3"/><circle cx="50" cy="50" r="12" fill="#1D4ED8"/><path d="M20 20 L35 35" stroke="#1D4ED8" stroke-width="2.5"/><polyline points="35 25 35 35 25 35" stroke="#1D4ED8" stroke-width="2.5" fill="none"/></svg>`,
  referto: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="20" width="45" height="30" rx="4" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/><line x1="20" y1="70" x2="45" y2="45" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/><polygon points="45 37 47 48 38 43" fill="#EF4444"/></svg>`,
  rigidly: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="25" width="40" height="50" fill="#F3F4F6" stroke="#111" stroke-width="4"/><line x1="20" y1="50" x2="80" y2="50" stroke="#EF4444" stroke-width="4"/></svg>`,
  selfcentered: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><circle cx="50" cy="50" r="14" fill="#EF4444"/><text x="50" y="54" text-anchor="middle" font-size="11" fill="#fff" font-family="Arial" font-weight="bold">ME</text></svg>`,
  rainyday: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><path d="M30 45 Q35 35 45 38 Q55 30 65 38 Q75 35 75 45 Z" fill="#93C5FD" stroke="#1D4ED8" stroke-width="2"/><line x1="35" y1="55" x2="30" y2="70" stroke="#1D4ED8" stroke-width="2"/><line x1="50" y1="55" x2="45" y2="70" stroke="#1D4ED8" stroke-width="2"/><line x1="65" y1="55" x2="60" y2="70" stroke="#1D4ED8" stroke-width="2"/></svg>`,
  moralwill: `<svg viewBox="0 0 100 100" width="110" xmlns="http://www.w3.org/2000/svg"><path d="M50 30 C35 10, 15 30, 50 75 C85 30, 65 10, 50 30 Z" fill="#F87171" stroke="#EF4444" stroke-width="2"/><text x="50" y="46" text-anchor="middle" font-size="10" fill="#fff" font-family="Arial" font-weight="bold">MORAL</text></svg>`
};

const vocab=[
  {w:'incentive',          ru:'стимул / побуждение',            uz:'rag\'batlantiruvchi omil', k:'incentive',    ex:'"We usually try to reward people by giving them incentives."'},
  {w:'stick',              ru:'трость (метод наказания)',        uz:'jazo tahdidi ("tayoq")',   k:'stick',        ex:'"What motivates you more: the carrot or the stick?"'},
  {w:'punishment',         ru:'наказание',                      uz:'jazo',                     k:'punishment',   ex:'"The threat of punishment is often used to control behavior."'},
  {w:'judgement',          ru:'суждение / мнение',              uz:'mulohaza / qaror',         k:'judgement',    ex:'"If people cannot use their own judgment, they make mistakes."'},
  {w:'rely on',            ru:'полагаться на',                  uz:'ishonmoq / tayanmoq',      k:'relyon',       ex:'"If we rely on incentives, people only focus on self-interest."'},
  {w:'end up',             ru:'оказаться в итоге',              uz:'yakunida ... bo\'lib qolmoq',k:'endup',      ex:'"You end up using your skills to manipulate people."'},
  {w:'self-interest',      ru:'личная выгода / интерес',        uz:'shaxsiy manfaatdorlik',    k:'selfinterest', ex:'"They are only concerned about their own self-interest."'},
  {w:'refer to',           ru:'ссылаться на / упоминать',       uz:'nazarda tutmoq / atamoq',  k:'referto',      ex:'"This is what psychologist Barry Schwarz refers to as practical wisdom."'},
  {w:'rigidly',            ru:'жестко / строго',                uz:'qat\'iy / qotib qolgan',   k:'rigidly',      ex:'"Nothing happens when they have to follow rules rigidly."'},
  {w:'self-centered',      ru:'эгоцентричный',                  uz:'xudbin / o\'zparast',      k:'selfcentered', ex:'"Incentives make us self-centered."'},
  {w:'rainy day',          ru:'черный день (образно)',          uz:'qiyin kunlar (moliyaviy)', k:'rainyday',     ex:'"They were saving money for a rainy day."'},
  {w:'moral will',         ru:'нравственная воля',              uz:'ma\'naviy iroda',          k:'moralwill',    ex:'"The second part of practical wisdom is moral will."' }
];

/* VOCABULARY MEMORY BOARD */
function makeBoard(){
  const opened=new Set();
  const wrap=document.createElement('div');wrap.className='board-full';
  const cnt=document.createElement('div');cnt.style.cssText='text-align:right;font-size:12px;color:#93C5FD;margin-bottom:6px;width:100%;max-width:1200px;';
  const grid=document.createElement('div');grid.className='board-grid';
  grid.style.gridTemplateColumns='repeat(4,1fr)';grid.style.gridAutoRows='1fr';grid.style.flex='1';
  const foot=document.createElement('div');foot.className='board-foot';
  const rb=document.createElement('button');rb.className='rb';rb.textContent='↺ Reset';
  function render(){
    const allOpen=opened.size===vocab.length;grid.innerHTML='';
    vocab.forEach((item,i)=>{
      const isOpen=opened.has(i);
      const card=document.createElement('div');card.className='fc'+(isOpen?' op':'');card.style.minHeight='0';
      if(isOpen){
        card.innerHTML=SVG[item.k].replace(/width="\d+"/,'width="50"')+'<div class="cw">'+item.w+'</div>'+(allOpen?'<div class="ct">🇷🇺 '+item.ru+'</div><div class="ct">🇺🇿 '+item.uz+'</div>':'');
      }else{
        card.innerHTML='<div class="qm">?</div>';
      }
      card.onclick=()=>{
        popCb=()=>{opened.add(i);render();};
        openPopup(SVG[item.k].replace(/width="\d+"/,'width="140"'),item.w,'🇷🇺 '+item.ru+'<br>🇺🇿 '+item.uz,item.ex);
      };
      grid.appendChild(card);
    });
    cnt.textContent=opened.size+' / '+vocab.length+' opened';
  }
  rb.onclick=()=>{opened.clear();render();};
  foot.appendChild(rb);wrap.appendChild(cnt);wrap.appendChild(grid);wrap.appendChild(foot);render();return wrap;
}

/* EXERCISE ANSWER CHECKS */
function checkTypedAnswer(inputEl, correctVal) {
  const val = inputEl.value.trim().toLowerCase();
  const expected = correctVal.toLowerCase();
  if (val === '') return;
  inputEl.classList.remove('correct', 'wrong');
  if (val.includes(expected) || expected.includes(val)) {
    inputEl.classList.add('correct');
  } else {
    inputEl.classList.add('wrong');
  }
}
window.checkTypedAnswer = checkTypedAnswer;

function tfAns(btn,ok){
  if(btn.classList.contains('correct')||btn.classList.contains('wrong'))return;
  const g=btn.closest('.tf-opts');g.querySelectorAll('.tf-btn').forEach(b=>b.onclick=null);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok)g.querySelectorAll('.tf-btn').forEach(b=>{if(b!==btn)b.classList.add('correct');});
}
window.tfAns=tfAns;
